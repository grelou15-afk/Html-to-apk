.sbar{position:relative;display:flex;align-items:center;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 6px 22px rgba(160,100,110,.15);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sbar{background:rgba(60,40,66,.5);border-color:rgba(255,255,255,.18)}}
:root[data-theme="dark"] .sbar{background:rgba(60,40,66,.5);border-color:rgba(255,255,255,.18)}
.sbar svg{flex:none;margin-left:14px}
.sbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:15px 12px;font:inherit;font-size:1.05rem}
.sbar input::placeholder{color:#b07a82;opacity:1}
.sbar input:focus{outline:0}
.sbar:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.sbar .x{flex:none;border:0;background:none;color:var(--gold);font-size:1.3rem;padding:8px 16px;cursor:pointer}
.sbar:has(input:placeholder-shown) .x{display:none}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 8px;padding-bottom:4px}
.tab{flex:none;border:0;background:var(--chip);color:var(--ink);padding:10px 16px;border-radius:12px;font:700 .95rem "Nunito Sans",sans-serif;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:5px 12px;border-radius:16px;font:600 .85rem "Nunito Sans",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.today{background:var(--accent2);color:#2e1b33;border-radius:16px;padding:14px 16px;margin:10px 0 6px}
.today b{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.card h3{margin:0 0 4px;font:400 1.2rem/1.25 "DM Serif Display",Georgia,serif}
.badge{display:inline-block;font-size:.78rem;font-weight:700;border-radius:8px;padding:1px 8px;margin-right:6px;background:var(--chip)}
.badge.t-Astuce{background:#d6efe3;color:#1b4a35}.badge.t-Technique{background:#e0dcf5;color:#2f2866}.badge.t-Idée{background:#fbdce8;color:#7a1f46}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fav{border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--accent);line-height:1}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-weight:700;font-size:.9rem}
.links a{color:var(--accent)}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
dt{font-weight:700}dd{margin:0 0 0}
.meta{color:var(--mute);font-size:.85rem}
.f input{display:block;width:100%;margin:6px 0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;font:700 .95rem "Nunito Sans",sans-serif;cursor:pointer;margin:4px 0}
.btn.wide{display:block;width:100%;text-align:left;background:var(--chip);color:var(--ink)}
.ck{display:flex;gap:10px;align-items:center;padding:6px 0}
.ck input{width:20px;height:20px;accent-color:var(--accent)}
.big{font:400 3rem "DM Serif Display",Georgia,serif;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Mon dictionnaire de beauté</h1><p class="sub">Cheveux, peau, maquillage : l’essentiel, chez vous, sans rendez-vous.</p></div>
  <button class="theme" id="theme" aria-label="Changer le thème">◐</button></div>
  <div class="sbar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b8934a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg><input type="search" id="q" placeholder="Rechercher un soin, une astuce…" aria-label="Rechercher"><button class="x" id="qx" aria-label="Effacer la recherche">✕</button></div>
  <div class="tabs" role="tablist" id="tabs"></div>

</div>
<script>
const TABS=["Cheveux","Peau","Maquillage","Recettes","Saisons & fêtes","Mon espace","Outils","Glossaire","Favoris"];
const SUBS={Cheveux:["Soins","Coiffures","Couleur","Boucles & lissage"],Peau:["Routine visage","Imperfections","Corps","Mains & ongles"],Maquillage:["Teint","Yeux","Lèvres","Express 5 min"],Recettes:["Cheveux","Visage","Corps"],"Saisons & fêtes":["Printemps","Été","Automne","Hiver","Événement"],"Mon espace":["Routines","Carnet","Courses","Calendrier"],Outils:["Minuteur","Quiz"]};
// [onglet, sujet, type, titre, texte, requête de recherche]
const D=[
["Cheveux","Soins","Astuce","Masque maison à l’huile","Appliquez de l’huile de coco ou d’argan sur les longueurs 30 minutes avant le shampoing. Évitez le cuir chevelu si vous avez les racines grasses.","masque cheveux huile maison"],
["Cheveux","Soins","Technique","Le shampoing en deux temps","Un premier passage nettoie le cuir chevelu, le second soigne. Massez du bout des doigts, jamais avec les ongles, et rincez à l’eau tiède.","comment bien laver ses cheveux"],
["Cheveux","Soins","Astuce","Rinçage final à l’eau fraîche","Un dernier rinçage frais aide à refermer les écailles du cheveu et apporte de la brillance.","rinçage eau froide cheveux brillance"],
["Cheveux","Soins","Idée","Un soin par semaine","Choisissez un jour fixe (le dimanche, par exemple) pour le masque ou le bain d’huile : c’est plus simple de s’y tenir.","routine soin cheveux hebdomadaire"],
["Cheveux","Coiffures","Idée","Chignon bas en 2 minutes","Rassemblez les cheveux en queue basse, enroulez, fixez avec des épingles. Tirez quelques mèches devant pour adoucir.","chignon bas facile tutoriel"],
["Cheveux","Coiffures","Technique","Tresse épi de blé","Séparez en deux, prenez une fine mèche à l’extérieur d’un côté et croisez-la vers l’autre, en alternant jusqu’en bas.","tresse épi de blé tutoriel"],
["Cheveux","Coiffures","Astuce","Cheveux gras en urgence","Du shampoing sec sur les racines, puis une coiffure attachée : le résultat tient toute la journée.","cheveux gras astuce shampoing sec"],
["Cheveux","Couleur","Astuce","Prolonger sa couleur","Utilisez un shampoing doux sans sulfates, lavez à l’eau tiède et espacez les lavages.","prolonger couleur cheveux"],
["Cheveux","Couleur","Technique","Test de mèche avant coloration","Appliquez le produit sur une petite mèche cachée et vérifiez la teinte. Faites aussi un test d’allergie 48 h avant, derrière l’oreille.","test allergie coloration cheveux"],
["Cheveux","Couleur","Idée","Balayage à la maison ou au salon ?","Pour un changement discret, un balayage doux est plus facile à entretenir qu’une couleur uniforme : la repousse se voit moins.","balayage idées couleur"],
["Cheveux","Boucles & lissage","Technique","Méthode du « plopping »","Après le soin, posez les boucles sur un t-shirt en coton roulé sur la tête 15 à 20 minutes pour mieux définir la boucle.","plopping boucles tutoriel"],
["Cheveux","Boucles & lissage","Astuce","Lisser sans abîmer","Utilisez toujours une protection thermique et des cheveux bien secs. Un seul passage lent vaut mieux que plusieurs rapides.","lissage cheveux protection thermique"],
["Cheveux","Boucles & lissage","Idée","Boucles sans chaleur","Tressez les cheveux légèrement humides le soir ou enroulez-les en petits chignons : les ondulations apparaissent au matin.","boucles sans chaleur nuit"],
["Peau","Routine visage","Technique","La routine de base : 3 étapes","Nettoyer, hydrater, protéger. Le matin : crème solaire SPF 30 minimum. Le soir : nettoyant puis crème hydratante.","routine visage débutante"],
["Peau","Routine visage","Technique","Le double nettoyage","Un produit gras (huile ou baume) retire maquillage et crème solaire, puis un nettoyant doux enlève le reste. Utile surtout les soirs de maquillage.","double nettoyage visage"],
["Peau","Routine visage","Astuce","Toujours une crème solaire","Même en hiver ou à l’intérieur près d’une fenêtre : c’est le meilleur geste anti-âge. Renouvelez toutes les 2 heures au soleil.","crème solaire visage conseils"],
["Peau","Routine visage","Idée","Masque d’argile hebdomadaire","L’argile verte convient aux peaux grasses, la rose aux peaux sensibles. Retirez-la avant qu’elle ne sèche complètement.","masque argile visage"],
["Peau","Imperfections","Astuce","Ne pas percer les boutons","Percer favorise les cicatrices. Un patch hydrocolloïdal protège et absorbe. Si l’acné est persistante, consultez un dermatologue.","patch bouton acné"],
["Peau","Imperfections","Technique","Atténuer les cernes","Dormez assez, hydratez le contour des yeux et, si besoin, utilisez un correcteur légèrement plus clair, appliqué en petits points.","atténuer cernes astuces"],
["Peau","Imperfections","Idée","Peau terne : un coup d’éclat","Une exfoliation douce une fois par semaine et un sérum à la vitamine C le matin redonnent de la lumière.","peau terne éclat routine"],
["Peau","Corps","Astuce","Hydrater sur peau humide","Appliquez le lait ou l’huile juste après la douche, quand la peau est encore légèrement humide : l’hydratation pénètre mieux.","hydrater peau corps après douche"],
["Peau","Corps","Technique","Gommage doux pour le corps","Une à deux fois par semaine, en mouvements circulaires, genoux et coudes compris. Un mélange sucre et huile suffit.","gommage corps maison"],
["Peau","Corps","Idée","Moment détente","Un bain tiède avec quelques gouttes d’huile végétale, 15 minutes, sans téléphone : un vrai soin à la maison.","rituel bain détente maison"],
["Peau","Mains & ongles","Astuce","Mains douces","Crème pour les mains après chaque lavage, et gants pour la vaisselle. Un masque de nuit avec des gants en coton fait des merveilles.","soin mains sèches"],
["Peau","Mains & ongles","Technique","Manucure à la maison","Limez dans un seul sens, repoussez les cuticules après un bain tiède, base, deux couches de vernis, top coat.","manucure maison tutoriel"],
["Peau","Mains & ongles","Idée","Ongles renforcés","Une huile pour cuticules chaque soir et un durcisseur 2 fois par semaine aident les ongles cassants.","ongles cassants soin"],
["Maquillage","Teint","Technique","Appliquer le fond de teint","Commencez au centre du visage et estompez vers l’extérieur avec une éponge humide. Peu de produit, en couches fines.","appliquer fond de teint tutoriel"],
["Maquillage","Teint","Astuce","Choisir sa teinte","Testez sur la mâchoire, pas sur la main, et regardez à la lumière du jour. La bonne teinte disparaît sur la peau.","choisir teinte fond de teint"],
["Maquillage","Teint","Idée","Teint frais en été","Une crème teintée ou un SPF teinté, un peu de blush crème sur les pommettes : léger et lumineux.","teint léger été maquillage"],
["Maquillage","Yeux","Technique","Eye-liner en trait fin","Posez la main sur la joue, regardez en bas dans un miroir et dessinez de petits traits reliés plutôt qu’une seule ligne.","eye-liner débutante tutoriel"],
["Maquillage","Yeux","Astuce","Mascara sans paquets","Essuyez l’excès sur le goupillon et appliquez en zigzag de la racine vers les pointes. Remplacez-le tous les 3 mois.","mascara astuces application"],
["Maquillage","Yeux","Idée","Smoky doux pour le soir","Un fard brun estompé près des cils, un trait de crayon sombre, un peu de lumière au coin de l’œil.","smoky eyes doux tutoriel"],
["Maquillage","Lèvres","Technique","Rouge à lèvres qui tient","Contour au crayon, remplissage, un mouchoir pour retirer l’excès, puis une deuxième couche.","rouge à lèvres tenue longue"],
["Maquillage","Lèvres","Astuce","Lèvres gercées","Un baume le soir et un gommage doux au sucre une fois par semaine avant le rouge à lèvres.","lèvres gercées soin"],
["Maquillage","Lèvres","Idée","Quelle couleur selon la peau ?","Les teintes rosées vont bien aux peaux claires, les corail aux peaux dorées, les baies et bordeaux aux peaux foncées. Testez avant d’acheter.","couleur rouge à lèvres selon teint"],
["Maquillage","Express 5 min","Technique","Maquillage de 5 minutes","Crème teintée, correcteur sous les yeux, blush crème, mascara, baume teinté. Cinq produits, cinq minutes.","maquillage rapide 5 minutes"],
["Maquillage","Express 5 min","Astuce","Une trousse minimaliste","Gardez un produit multi-usage : un stick crème pour joues et lèvres vous sauve en déplacement.","trousse maquillage minimaliste"],
["Maquillage","Express 5 min","Idée","Look du bureau","Teint léger, mascara marron, rose naturel : un visage reposé sans effort.","maquillage naturel bureau"],
["Recettes","Cheveux","Technique","Masque banane et miel","Écrasez 1 banane mûre, ajoutez 1 cuillère à soupe de miel et 1 d’huile d’olive. Posez 20 minutes sur les longueurs, puis shampoing. À préparer et utiliser le jour même.","masque cheveux banane miel"],
["Recettes","Cheveux","Astuce","Spray brillance au romarin","Infusez du romarin, laissez refroidir, filtrez et vaporisez sur les cheveux. Se garde 3 jours au réfrigérateur.","eau de romarin cheveux"],
["Recettes","Visage","Technique","Masque avocat et yaourt","Mélangez une demi-avocat mûr et 1 yaourt nature. Posez 15 minutes, rincez à l’eau tiède. Jour même. Testez d’abord sur un petit coin de peau.","masque visage avocat yaourt"],
["Recettes","Visage","Technique","Masque apaisant à l’avoine","Mixez 2 cuillères à soupe de flocons d’avoine, ajoutez de l’eau tiède et un peu de miel. Posez 10 minutes. Jour même.","masque avoine miel visage"],
["Recettes","Corps","Technique","Gommage sucre et huile","Mélangez 1/2 tasse de sucre et 1/4 de tasse d’huile végétale. Gardez dans un pot propre et sec, sans eau : environ 2 semaines.","gommage sucre huile corps"],
["Recettes","Corps","Idée","Baume à lèvres maison","Faites fondre 1 cuillère de cire d’abeille avec 2 d’huile de coco ou de beurre de karité, versez dans un petit pot. Se garde plusieurs mois.","baume lèvres maison cire abeille"],
["Saisons & fêtes","Printemps","Astuce","Peau réactive au printemps","Passez à des produits doux, sans parfum, et allégez les textures au retour des beaux jours.","soin peau printemps"],
["Saisons & fêtes","Été","Astuce","Cheveux et peau à la plage","SPF renouvelé toutes les 2 heures, rinçage des cheveux à l’eau douce après la mer ou la piscine, masque nourrissant une fois par semaine.","soin cheveux été plage"],
["Saisons & fêtes","Automne","Astuce","Réparer après l’été","Gommage doux, masque hydratant et coupe des pointes. Une chute de cheveux légère à cette saison est fréquente.","soin automne cheveux peau"],
["Saisons & fêtes","Hiver","Astuce","Contre le froid et le chauffage","Crème plus riche, baume à lèvres, huile sur les cheveux secs. Gardez la crème solaire, même en hiver.","soin peau hiver sèche"],
["Saisons & fêtes","Événement","Technique","J-7 : préparer","Coupe des pointes, coloration si besoin, début d’une routine hydratante. Pas de produit nouveau ensuite.","préparation beauté mariage"],
["Saisons & fêtes","Événement","Technique","J-3 : essai","Masque, gommage doux et essai complet du maquillage et de la coiffure pour ajuster.","essai maquillage coiffure événement"],
["Saisons & fêtes","Événement","Technique","J-1 : détails","Manucure, préparation de la trousse de retouches, tenue prête et une bonne nuit de sommeil.","manucure veille événement"],
["Saisons & fêtes","Événement","Technique","Jour J : simple","Hydratez bien, appliquez le fixateur et gardez une trousse de retouches : baume, rouge à lèvres, poudre.","retouches maquillage jour J"]
];
const G=[
["Sébum","Matière grasse produite par la peau pour la protéger. En excès, elle donne une peau ou des cheveux gras."],
["Non comédogène","Se dit d’un produit qui ne bouche pas les pores."],
["SPF","Indice de protection contre les UVB. SPF 30 filtre environ 97 % des UVB, SPF 50 environ 98 %."],
["Exfoliation","Élimination des cellules mortes, par gommage ou acides doux, pour affiner le grain de peau."],
["Humectant","Ingrédient qui retient l’eau, comme l’acide hyaluronique ou la glycérine."],
["Émollient","Corps gras qui adoucit et assouplit la peau, comme le beurre de karité."],
["Rétinol","Dérivé de la vitamine A qui lisse les rides et affine la peau. À introduire progressivement, jamais pendant la grossesse sans avis médical."],
["Kératine","Protéine qui compose cheveux et ongles."],
["Porosité capillaire","Capacité du cheveu à absorber et garder l’eau. Un cheveu poreux se dessèche vite."],
["Co-wash","Lavage des cheveux avec un après-shampoing sans shampoing, courant pour les cheveux bouclés ou secs."],
["Primer","Base appliquée avant le fond de teint pour lisser la peau et améliorer la tenue."],
["Contouring","Technique qui sculpte le visage avec des teintes plus foncées et plus claires."],
["Strobing","Application de lumière sur les points hauts du visage pour un teint lumineux."],
["Fixateur","Spray ou poudre qui aide le maquillage à tenir plus longtemps."],
["Cuticules","Fine peau à la base de l’ongle. On la repousse, on ne la coupe pas."]
];
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let tab="Cheveux",sub=null,query="",favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("beaute-favs")||"[]"))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("beaute-favs",JSON.stringify([...favs]))}catch(e){}};
const $=id=>document.getElementById(id);
const enc=encodeURIComponent;
function card(e){const id=e[3];const q=enc(e[5]);
return `<div class="card"><div class="row"><div><span class="badge t-${e[2]}">${e[2]}</span><span class="meta">${e[0]} · ${e[1]}</span></div><button class="fav" data-id="${id}" aria-label="Favori" aria-pressed="${favs.has(id)}">${favs.has(id)?"♥":"♡"}</button></div><h3>${e[3]}</h3><div>${e[4]}</div><div class="links"><a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${q}">Photos</a><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}">Vidéos</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}">Sites</a></div></div>`}
function render(){
 $("tabs").innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${t===tab&&!query}" data-tab="${t}">${t==="Favoris"?"♥ Favoris":t}</button>`).join("");
 const subs=SUBS[tab]&&!query?SUBS[tab]:[];
 $("chips").innerHTML=subs.length?(TOOL.includes(tab)?subs:["Tout",...subs]).map(s=>`<button class="chip" aria-pressed="${(sub||(TOOL.includes(tab)?subs[0]:"Tout"))===s}" data-sub="${s}">${s}</button>`).join(""):"";
 let h="";
 if(query){const n=norm(query);
  const r=D.filter(e=>norm(e.slice(0,6).join(" ")).includes(n)),g=G.filter(x=>norm(x.join(" ")).includes(n));
  h=r.map(card).join("")+(g.length?`<h3>Glossaire</h3><dl>${g.map(x=>`<div class="card"><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join("")}</dl>`:"");
  if(!h)h=`<p class="empty">Aucun résultat pour « ${query.replace(/</g,"&lt;")} ». Essayez un mot plus court, comme « boucles » ou « teint ».</p>`;
 }else if(TOOL.includes(tab)){h=tools()}else if(tab==="Glossaire"){h=`<dl>${G.slice().sort((a,b)=>a[0].localeCompare(b[0],"fr")).map(x=>`<div class="card"><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join("")}</dl>`}
 else if(tab==="Favoris"){const r=D.filter(e=>favs.has(e[3]));h=r.length?r.map(card).join(""):`<p class="empty">Pas encore de favoris. Touchez ♡ sur une fiche pour la retrouver ici.</p>`}
 else{const r=D.filter(e=>e[0]===tab&&(!sub||e[1]===sub));
  const day=D[Math.floor(Date.now()/864e5)%D.length];
  h=(sub?"":`<div class="today"><b>Astuce du jour</b><br>${day[3]} : ${day[4]}</div>`)+r.map(card).join("")}
 $("out").innerHTML=h;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;sub=null;query="";$("q").value="";render();return}
 const s=e.target.closest("[data-sub]");if(s){sub=s.dataset.sub==="Tout"?null:s.dataset.sub;render();return}
 const a=e.target.closest("[data-act]");if(a){act(a);return}const f=e.target.closest(".fav");if(f){const id=f.dataset.id;favs.has(id)?favs.delete(id):favs.add(id);saveFavs();render()}
});
const TOOL=["Mon espace","Outils"],M={};
const ld=(k,d)=>{if(k in M)return M[k];let v=d;try{const r=localStorage.getItem("b-"+k);if(r!==null)v=JSON.parse(r)}catch(e){}return M[k]=v};
const sv=(k,v)=>{M[k]=v;try{localStorage.setItem("b-"+k,JSON.stringify(v))}catch(e){}};
const td=()=>new Date().toLocaleDateString("sv");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RT={Matin:["Nettoyer le visage","Hydrater","Crème solaire","Brosser les cheveux"],Soir:["Démaquiller","Nettoyer le visage","Sérum ou soin ciblé","Hydrater","Huile pour cuticules"]};
const QZ={peau:{q:[["Deux heures après le nettoyage, ma peau…",["brille partout","tiraille","brille au front et au nez","est confortable"]],["Mes pores sont…",["visibles partout","peu visibles, peau parfois rugueuse","visibles sur le nez","fins"]],["En fin de journée, mon maquillage…",["glisse et brille","se marque sur les peaux sèches","brille au front et au nez","tient bien"]]],s:["peau grasse","peau sèche","peau mixte","peau normale"],r:["Nettoyant doux, hydratant léger non comédogène, SPF fluide.","Crème riche, nettoyant sans savon, huile ou baume le soir.","Textures légères sur le front et le nez, plus nourrissantes sur les joues.","Gardez une routine simple et la crème solaire chaque jour."]},
cheveux:{q:[["Un jour après le shampoing, mes cheveux…",["ont les racines grasses","sont secs, pointes cassantes","vont bien","frisottent"]],["Mes pointes sont…",["correctes, racines grasses","fourchues et rêches","souples","sèches, boucles marquées"]],["Mon cheveu naturel est…",["plat, vite gras","terne et cassant","souple et brillant","ondulé ou bouclé"]]],s:["cheveux gras","cheveux secs","cheveux normaux","cheveux bouclés"],r:["Shampoing doux, soins uniquement sur les longueurs.","Shampoing nourrissant, masque chaque semaine, peu de chaleur.","Routine simple, un masque de temps en temps.","Co-wash ou shampoing doux, soin sans rinçage, démêlage sur cheveux humides."]}};
let qz=null,tEnd=0,tInt=null;
function tick(){if(!tEnd)return;const l=tEnd-Date.now(),el=$("tm");if(l<=0){clearInterval(tInt);tEnd=0;if(el)el.textContent="Terminé !";beep();return}if(el)el.textContent=String(Math.floor(l/6e4)).padStart(2,"0")+":"+String(Math.floor(l%6e4/1e3)).padStart(2,"0")}
function beep(){try{navigator.vibrate&&navigator.vibrate([300,150,300]);const c=new(window.AudioContext||window.webkitAudioContext)();[0,.4,.8].forEach(t=>{const o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}}
function tools(){const s=sub||SUBS[tab][0];let h="";
if(s==="Routines"){const c=ld("rt-"+td(),{});h=Object.keys(RT).map(p=>`<div class="card"><h3>${p}</h3>${RT[p].map((x,i)=>{const k=p+i;return `<label class="ck"><input type="checkbox" data-act="chk" data-k="${k}" ${c[k]?"checked":""}> ${x}</label>`}).join("")}</div>`).join("")+`<p class="meta">Les cases se remettent à zéro chaque jour. Pour un rappel, programmez une alarme sur votre téléphone.</p>`}
else if(s==="Carnet"){const L=ld("carnet",[]);h=`<div class="card f"><h3>Ajouter un produit</h3><input id="pn" placeholder="Nom du produit"><input id="pc" placeholder="Catégorie (shampoing, crème…)"><label class="meta">Date d’ouverture<input id="pd" type="date"></label><input id="pt" placeholder="Mon avis (ex. 4/5, parfum agréable)"><button class="btn" data-act="addp">Ajouter</button></div>`+(L.length?L.map((p,i)=>{const m=p.d?Math.max(0,Math.round((Date.now()-new Date(p.d))/2.63e9)):null;return `<div class="card"><div class="row"><h3>${esc(p.n)}</h3><button class="fav" data-act="delp" data-i="${i}" aria-label="Supprimer">✕</button></div><div class="meta">${esc(p.c||"")}${m!==null?` · ouvert depuis ${m} mois`:""}</div><div>${esc(p.t||"")}</div></div>`}).join(""):`<p class="empty">Aucun produit pour l’instant. Ajoutez ce que vous utilisez et notez ce qui vous convient.</p>`)+`<p class="meta">Le symbole du pot ouvert sur l’emballage indique la durée d’utilisation après ouverture.</p>`}
else if(s==="Courses"){const L=ld("shop",[]),B=ld("budget",0);const tot=L.reduce((a,x)=>a+(+x.p||0),0),rest=L.filter(x=>!x.k).reduce((a,x)=>a+(+x.p||0),0);h=`<div class="card f"><h3>Liste de courses</h3><input id="sn" placeholder="Produit"><input id="sp" type="number" min="0" placeholder="Prix estimé"><button class="btn" data-act="adds">Ajouter</button></div><div class="card f"><div>Total : <b>${tot}</b> · Reste à acheter : <b>${rest}</b></div><input id="sb" type="number" min="0" placeholder="Mon budget" value="${B||""}"><button class="btn" data-act="setb">Fixer le budget</button>${B?`<div class="meta">${tot>B?"Dépassement de "+(tot-B):"Il reste "+(B-tot)+" sur le budget"}</div>`:""}</div>`+L.map((x,i)=>`<div class="card row"><label class="ck"><input type="checkbox" data-act="tgs" data-i="${i}" ${x.k?"checked":""}> ${esc(x.n)} · ${x.p||0}</label><button class="fav" data-act="dels" data-i="${i}" aria-label="Supprimer">✕</button></div>`).join("")}
else if(s==="Calendrier"){const c=ld("col","");const f=n=>new Date(new Date(c).getTime()+n*6048e5).toLocaleDateString("fr-FR");h=`<div class="card"><h3>Semaine type</h3><dl><dt>Dimanche</dt><dd>Masque ou bain d’huile pour les cheveux</dd><dt>Mercredi</dt><dd>Gommage du corps</dd><dt>Vendredi</dt><dd>Masque visage</dd><dt>Samedi</dt><dd>Manucure et soin des mains</dd></dl></div><div class="card"><h3>Rythmes à retenir</h3><dl><dt>Toutes les 6 à 8 semaines</dt><dd>Couleur ou retouche des racines, coupe des pointes</dd><dt>Tous les 3 mois</dt><dd>Remplacer le mascara</dd><dt>Chaque saison</dt><dd>Revoir sa routine</dd></dl></div><div class="card f"><h3>Ma dernière coloration</h3><input id="cc" type="date" value="${c}"><button class="btn" data-act="setc">Enregistrer</button>${c?`<div>Prochaine retouche entre le <b>${f(6)}</b> et le <b>${f(8)}</b>.</div>`:""}</div>`}
else if(s==="Minuteur"){h=`<div class="card"><h3>Minuteur de pose</h3><div id="tm" class="big">${tEnd?"…":"00:00"}</div><div class="links">${[5,10,15,20,30].map(m=>`<button class="chip" data-act="tm" data-m="${m}">${m} min</button>`).join("")}<button class="chip" data-act="tstop">Arrêter</button></div><p class="meta">Gardez cet écran ouvert : le son et la vibration se déclenchent à la fin.</p></div>`;if(tEnd)setTimeout(tick,0)}
else if(!qz){h=`<div class="card"><h3>Quel est mon type ?</h3><div class="links"><button class="btn" data-act="qs" data-k="peau">Ma peau</button><button class="btn" data-act="qs" data-k="cheveux">Mes cheveux</button></div></div>`}
else{const Q=QZ[qz.k],n=qz.a.length;if(n<3)h=`<div class="card"><div class="meta">Question ${n+1} sur 3</div><h3>${Q.q[n][0]}</h3>${Q.q[n][1].map((o,i)=>`<button class="btn wide" data-act="qa" data-v="${i}">${o}</button>`).join("")}</div>`;else{const ct=[0,0,0,0];qz.a.forEach(v=>ct[v]++);const r=ct.indexOf(Math.max(...ct)),z=enc("routine "+Q.s[r]);h=`<div class="card"><h3>Résultat : ${Q.s[r]}</h3><div>${Q.r[r]}</div><div class="links"><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${z}">Sites</a><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${z}">Vidéos</a><button class="btn" data-act="qr">Refaire le quiz</button></div></div>`}}
return h}
function act(a){const d=a.dataset,k=d.act,v=id=>($(id)&&$(id).value.trim())||"";
if(k==="chk"){const c=ld("rt-"+td(),{});c[d.k]=!c[d.k];sv("rt-"+td(),c);return}
if(k==="addp"){if(!v("pn"))return;sv("carnet",[{n:v("pn"),c:v("pc"),d:v("pd"),t:v("pt")},...ld("carnet",[])])}
else if(k==="delp"){sv("carnet",ld("carnet",[]).filter((_,i)=>i!=d.i))}
else if(k==="adds"){if(!v("sn"))return;sv("shop",[...ld("shop",[]),{n:v("sn"),p:+v("sp")||0,k:0}])}
else if(k==="tgs"){sv("shop",ld("shop",[]).map((x,i)=>i==d.i?{...x,k:x.k?0:1}:x))}
else if(k==="dels"){sv("shop",ld("shop",[]).filter((_,i)=>i!=d.i))}
else if(k==="setb"){sv("budget",+v("sb")||0)}
else if(k==="setc"){sv("col",v("cc"))}
else if(k==="tm"){clearInterval(tInt);tEnd=Date.now()+d.m*6e4;tInt=setInterval(tick,500)}
else if(k==="tstop"){clearInterval(tInt);tEnd=0}
else if(k==="qs"){qz={k:d.k,a:[]}}
else if(k==="qa"){qz.a.push(+d.v)}
else if(k==="qr"){qz=null}
render()}
$("qx").addEventListener("click",()=>{$("q").value="";query="";render();$("q").focus()});
$("q").addEventListener("input",e=>{query=e.target.value.trim();render()});
$("theme").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"});
render();
</script>
</body>
</html>
