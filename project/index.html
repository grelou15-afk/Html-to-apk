<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de mes comptes</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2EF;--card:#fff;--ink:#12303A;--mut:#5B7077;--line:#D5DFDB;--acc:#E8A317;--tg:#1F8FCB;--fb:#3B5BDB;--fu:#7A4BC4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B20;--card:#17272E;--ink:#E7F0EE;--mut:#93A9AF;--line:#2A3E46;--tg:#4DB3EA;--fb:#7C93F5;--fu:#B08EEB}}
:root[data-theme="dark"]{--bg:#0F1B20;--card:#17272E;--ink:#E7F0EE;--mut:#93A9AF;--line:#2A3E46;--tg:#4DB3EA;--fb:#7C93F5;--fu:#B08EEB}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque','Tajawal',system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;margin:4px 0 12px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 8px}
.tabs,.lang{display:flex;gap:6px}
.tabs{overflow-x:auto;padding-bottom:4px}
button{font:inherit;cursor:pointer}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:600}
.tab[aria-selected=true],.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 10px;border-radius:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em}
.mut{color:var(--mut);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpis b{display:block;font-size:22px;font-weight:800}
.kpis span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select{width:100%;box-sizing:border-box;font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600;margin-top:12px}
.btn.alt{background:transparent;color:var(--mut);border:1px solid var(--line)}
.tip{border-inline-start:4px solid var(--acc);padding:4px 12px;margin:12px 0}
.tip b{display:block}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{width:20px;height:20px;margin-top:3px;flex:none}
.chk label{color:var(--ink);font-size:16px}
summary{font-weight:700;cursor:pointer}
ol{padding-inline-start:22px;margin:10px 0 0}
li{margin:6px 0}
svg{width:100%;height:auto;display:block}
a{color:var(--tg)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:start;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}

:root{--ov:rgba(237,242,239,.84)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ov:rgba(15,27,32,.80)}}
:root[data-theme="dark"]{--ov:rgba(15,27,32,.80)}

function importCsv(inp){
 var f=inp.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  var c=0;
  String(r.result).split(/\r?\n/).forEach(function(l){
   var p=l.split(",");
   if(!/^\d{4}-\d{2}-\d{2}$/.test(p[0])||n(p[1])==null)return;
   var ex=S.e.tg.filter(function(x){return x.d===p[0]})[0];
   if(ex)ex.f=Number(p[1]);else S.e.tg.push({d:p[0],f:Number(p[1]),p:"",v:"",i:""});
   c++;
  });
  imsg=T("impd",c);save();render();
 };
 r.readAsText(f);
}

var OP={0:1};

function ago(d){return new Date(Date.now()-d*864e5).toISOString().slice(0,10)}

function mkRep(){
 var lab=T("lab").split("|"),sc=T("sec").split("|"),o=[T("rt",today)];
 ACC.forEach(function(a,i){
  var L=srt(a.id),m=metrics(L),old=L.filter(function(x){return x.d<=ago(30)}).pop()||L[0],dl=old?m.f-old.f:null;
  o.push(lab[i]+" : "+fmt(m.f)+" ("+(dl==null?"–":(dl>=0?"+":"")+fmt(dl))+") · "+T("eng")+" "+(m.er==null?"–":fmt(m.er)+" %"));
 });
 var tp=lst("top").slice().sort(function(a,b){return b.i-a.i})[0];
 if(tp)o.push(sc[3]+" : "+tp.t+" ("+fmt(tp.i)+")");

 if(l)o.push(sc[4]+" : "+fmt(l.n));
 o.push(T("pd",Object.keys(S.c).filter(function(k){return S.c[k]}).length,12));
 document.getElementById("rep").value=o.join("\n");
}

function setGoal(id,v){var x=n(v);if(x>0){S.g[id]=x;save();render()}}
function add(id){
 var f=n(document.getElementById("inF").value),d=document.getElementById("inD").value||today;
 if(f==null||f<0){document.getElementById("inF").focus();return}
 var e={d:d,f:f,p:document.getElementById("inP").value,v:document.getElementById("inV").value,i:document.getElementById("inI").value};
 S.e[id]=(S.e[id]||[]).filter(function(x){return x.d!==d});
 S.e[id].push(e);save();render();window.scrollTo(0,0);
}
function delLast(id){
 var L=(S.e[id]||[]).slice().sort(function(x,y){return x.d<y.d?-1:1});
 if(!L.length)return;
 var last=L[L.length-1].d;
 S.e[id]=S.e[id].filter(function(x){return x.d!==last});save();render();
}

render();
