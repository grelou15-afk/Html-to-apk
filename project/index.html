@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body::before{filter:brightness(.3)}}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ac);color:#fff;flex-wrap:wrap;gap:6px}
header b{font:700 20px Georgia,serif}
@media(prefers-color-scheme:dark){header{color:#0f1624}}
nav{display:flex;overflow-x:auto;gap:4px;padding:8px;background:color-mix(in srgb,var(--sf) 88%,transparent);border-bottom:1px solid var(--bd)}
nav button{flex:none;border:0;background:none;color:var(--mu);padding:6px 10px;border-radius:10px;font-size:13px}
nav button.on{background:var(--g);color:#14213d;font-weight:700}
main{padding:8px 12px 110px;max-width:720px;margin:auto}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--g)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){.pri{color:#0f1624}}
.card{background:color-mix(in srgb,var(--sf) 88%,transparent);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.card h2,.card h3{margin:0 0 6px;font-family:Georgia,serif}
.mu{color:var(--mu)}.big{font:700 22px Georgia,serif}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border-radius:20px}.on{background:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){.on{color:#0f1624}}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px}
.opt.ok,.ok{background:var(--ok);color:#fff}.opt.ko{background:var(--ko);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cd{height:64px;font-weight:700}
.al{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.al button{padding:6px 2px;font-size:12px}.al b{display:block;font-size:20px}
.li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.li span{flex:1}
.ic{padding:2px 8px;margin-left:auto}
.bd{display:inline-block;margin:3px;padding:4px 10px;border-radius:20px;border:1px solid var(--bd);opacity:.4}.bd.y{opacity:1;background:var(--g);color:#14213d}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--bd);padding:5px 7px;text-align:left}

function mic(){const o=$("#spo"),C=window.SpeechRecognition||window.webkitSpeechRecognition;let skip=false;try{skip=localStorage.getItem("dm_nomic")==="1"}catch(e){}if(!C||skip){vdict("ℹ️ La reconnaissance vocale directe n'existe pas dans cette appli.");return}try{const r=new C();let got=false,started=false,done=false,w1,w2;const fin=()=>{done=true;clearTimeout(w1);clearTimeout(w2)};const fall=(why,perm)=>{if(done)return;fin();try{r.abort()}catch(e){}if(perm){try{localStorage.setItem("dm_nomic","1")}catch(e){}}vdict(why)};r.lang="de-DE";r.interimResults=false;r.maxAlternatives=1;o.textContent="🎤 J'écoute…";r.onstart=()=>{started=true;clearTimeout(w1)};r.onaudiostart=()=>{started=true;clearTimeout(w1)};r.onend=()=>{if(done)return;fin();if(!got){if(started)o.textContent="Je n'ai rien entendu. Réessaie.";else vdict("🎤 La voix directe ne répond pas dans cette appli.")}};r.onresult=e=>{if(done&&got)return;got=true;fin();vchk(e.results[0][0].transcript)};r.onerror=e=>{const k=e&&e.error;if(done)return;if(k==="not-allowed"||k==="service-not-allowed"||k==="audio-capture"||k==="language-not-supported")fall("🎤 Le micro vocal est bloqué dans l'appli.",1);else if(k==="network")fall("🌐 Connexion nécessaire pour la reconnaissance vocale.");else if(k==="no-speech"){fin();o.textContent="Je n'ai rien entendu. Réessaie."}else if(k==="aborted"){}else fall("🎤 Micro indisponible.",1)};w1=setTimeout(()=>{if(!started)fall("🎤 La voix directe ne répond pas dans cette appli.",1)},3000);w2=setTimeout(()=>{if(!got)fall("🎤 Je n'ai pas pu t'entendre.")},12000);r.start()}catch(e){vdict("🎤 Micro indisponible.")}}
const wc=()=>{$("#wcn").textContent=$("#wt").value.trim().split(/\s+/).filter(Boolean).length+" mot(s)"};
function wsave(){const t=$("#wt").value.trim();if(!t)return;S.texts.push({d:day(),p:wp,t});add(10,"ecr");$("#wcn").textContent="💾 Enregistré !"}
function wsend(){const t=$("#wt").value.trim();if(!t)return;const x=wp+"\n\n"+t;try{navigator.share?navigator.share({text:x}).catch(()=>{}):navigator.clipboard.writeText(x).then(()=>alert("Texte copié : colle-le dans un message pour ton prof."))}catch(e){}}
function srch(v){const o=$("#sr");v=v.trim().toLowerCase();if(!v){o.hidden=true;return}let h="";N.filter(w=>(w.d+" "+w.f).toLowerCase().includes(v)).slice(0,6).forEach(w=>h+=`<div class=li onclick="say('${w.a} ${w.d}')">📚 ${A(w)} <b>${w.d}</b> <span class=mu>${w.f}</span> 🔊</div>`);Object.entries(G).forEach(([l,a])=>a.forEach(g=>{if(g.t.toLowerCase().includes(v))h+=`<div class=li onclick="lv='${l}';gs='r';show('gram')">📖 ${g.t} <span class=mu>${l}</span></div>`}));TB.filter(x=>x[2].toLowerCase().includes(v)).forEach(x=>h+=`<div class=li onclick="show('${x[0]}')">${x[1]} ${x[2]}</div>`);o.innerHTML=h||"<p class=mu>Aucun résultat.</p>";o.hidden=false}
const sx=x=>`<p class=ex>🔊 <a href="#" onclick="say('${x[0].replace(/'/g,"")}');return false">${x[0]}</a><br><span class=mu>${x[1]}</span></p>`;
const R={
kap(){return `<p class=mu>Suis les chapitres dans l'ordre : écouter, apprendre, parler, écrire, tester.</p>`+KP.map((k,i)=>{const n=ST.filter((_,j)=>S.ch[i+"-"+j]).length;return `<div class=card><h3>Kapitel ${i+1} · ${k[0]} <small class=mu>${k[1]}</small></h3><progress value=${n} max=6 style="width:100%"></progress><div class=row>${ST.map((s,j)=>`<button class="chip ${S.ch[i+"-"+j]?"on":""}" onclick="stp(${i},${j})">${s}</button>`).join("")}</div></div>`}).join("")},
spk(){return `<div class=card id=spp><p>Écoute, puis répète à voix haute : l'appli t'écoute et te dit si c'est juste.</p><button class=pri onclick=sk()>Commencer</button></div>`},
schr(){const ps=WP[lv];wp=wp||ps[0];return `<div class=row>${Object.keys(G).map(l=>`<button class="chip ${lv==l?"on":""}" onclick="lv='${l}';wp='';show('schr')">${l}</button>`).join("")}</div><div class=card><p><b>Thema :</b></p>${ps.map(p=>`<button class="chip ${wp==p?"on":""}" data-p="${esc(p)}" onclick="wp=this.dataset.p;show('schr')">${esc(p)}</button>`).join("")}<textarea id=wt rows=8 placeholder="Schreibe hier auf Deutsch…" oninput=wc()></textarea><p class=mu id=wcn>0 mot(s)</p><button onclick="say($('#wt').value)">🔊 Écouter</button> <button class=pri onclick=wsave()>💾 Enregistrer</button> <button onclick=wsend()>📤 Envoyer au prof</button></div>`},
home(){const due=N.filter(w=>!S.box[w.d]||S.box[w.d].d<=Date.now()).length,B=[[S.pts>=50,"🥉 50 pts"],[S.pts>=200,"🥈 200 pts"],[S.pts>=500,"🥇 500 pts"],[S.streak>=3,"🔥 3 jours"],[S.streak>=7,"🔥 7 jours"]];return `<div class=card id=q hidden></div><div class=card><h2>Willkommen !</h2><p>Niveau conseillé : <b>${S.lv||"à découvrir"}</b></p><button class=pri onclick=test()>🎯 Test de niveau</button></div><div class=card><h3>⭐ Défi du jour</h3><p class=mu>5 questions sur les articles ${S.dd===day()?"— déjà fait ✅":"(+20 pts)"}</p><button class=pri onclick=daily()>Commencer</button></div>${S.hw?`<div class=card><h3>📝 Devoirs</h3><p>${esc(S.hw)}</p></div>`:""}<div class=card><h3>🏅 Badges</h3>${B.map(b=>`<span class="bd ${b[0]?"y":""}">${b[1]}</span>`).join("")}<p>🧠 ${due} mot(s) à réviser</p><button onclick="show('voc');rev()">Réviser</button></div>`},
gram(){const tabs=[["r","Règles"],["c","Cas"],["v","Verbes"]].map(([k,l])=>`<button class="chip ${gs==k?"on":""}" onclick="gs='${k}';show('gram')">${l}</button>`).join("");let b="";if(gs=="r")b=`<div class=row>${Object.keys(G).map(l=>`<button class="chip ${lv==l?"on":""}" onclick="lv='${l}';show('gram')">${l}</button>`).join("")}</div>`+G[lv].map(g=>`<div class=card><h3>${g.t}</h3><p>${g.r}</p>${g.x.map(sx).join("")}</div>`).join("");else if(gs=="c")b=`<div class="card w"><h3>Articles définis</h3><table><tr><th></th><th>m.</th><th>f.</th><th>n.</th><th>pl.</th></tr><tr><th>Nom.</th><td>der</td><td>die</td><td>das</td><td>die</td></tr><tr><th>Akk.</th><td>den</td><td>die</td><td>das</td><td>die</td></tr><tr><th>Dat.</th><td>dem</td><td>der</td><td>dem</td><td>den (+n)</td></tr><tr><th>Gen.</th><td>des (+s)</td><td>der</td><td>des (+s)</td><td>der</td></tr></table></div>`;else b=`<div class="card w"><table><tr><th></th><th>ich</th><th>du</th><th>er/sie</th><th>wir</th><th>ihr</th><th>sie</th></tr>${VB.map(v=>`<tr><th>${v[0]}</th>${v.slice(1).map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div><div class=card><h3>Verbes séparables</h3>${[["aufstehen","Ich stehe um sieben Uhr auf."],["einkaufen","Wir kaufen heute ein."],["anrufen","Er ruft mich an."],["mitkommen","Kommst du mit?"]].map(x=>sx([x[1],x[0]])).join("")}</div>`;return `<div class=row>${tabs}</div>`+b},
alpha(){return `<p class=mu>Touche une lettre pour l'écouter.</p><div class=al>${AL.map((l,i)=>`<button onclick="say('${l}. ${EW[i]}')"><b>${l}</b>${EW[i]}</button>`).join("")}</div>`},
pron(){return `<div class=card><h3>Pièges pour francophones</h3>${PI.map(p=>`<div class=li><span><b>${p[0]}</b> — ${p[1]}<br><small class=mu>${p[2]}</small></span><button class=ic onclick="say('${p[1].split(" ")[0]}')">🔊</button></div>`).join("")}</div><div class=card><h3>🎙 Compare ta voix</h3><p class=mu>Écoute le modèle, enregistre-toi, puis réécoute.</p><button id=rb onclick=rec()>🎙 Enregistrer</button><audio id=au controls hidden></audio></div><div class=card><h3>✍️ Dictée audio</h3><button onclick=dic()>🔊 Nouveau mot</button> <button onclick="say(DW)">Réécouter</button><input id=di placeholder="Écris le mot"><button class=pri onclick=chk()>Vérifier</button><p id=dr></p></div>`},
voc(){return `<input id=sq placeholder="🔍 Dictionnaire (allemand ou français)" value="${esc(vq)}" oninput="vq=this.value;$('#vl').innerHTML=vl()"><div class=row>${Object.keys(VOC).map(t=>`<button class="chip ${vt==t&&!vq?"on":""}" onclick="vt='${t}';vq='';show('voc')">${t}</button>`).join("")}<button class=chip onclick=rev()>🧠 Réviser</button></div><div class=card id=vl>${vl()}</div>`},
ex(){return `<div class=row>${["A1","A2","B1","B2","my"].map(l=>`<button class=chip onclick="ex('${l}')">${l=="my"?"Mes exercices":l}</button>`).join("")}</div><div class=card id=q><p class=mu>Choisis un niveau.</p></div>`},
games(){return `<div class=row>${[["mem","🃏 Mémoire"],["pen","🔤 Pendu"],["ord","🧩 Phrases"],["chr","⏱ Chrono"]].map(g=>`<button class=chip onclick="gm('${g[0]}')">${g[1]}</button>`).join("")}</div><div class=card id=g><p class=mu>Choisis un jeu.</p></div>`},
dial(){return D.map(d=>`<div class=card><h3>${d[0]}</h3>${d[1].map((l,i)=>`<div class=li><span>${i%2?"B":"A"} : ${l}</span><button class=ic onclick="say('${l.replace(/'/g,"")}')">🔊</button></div>`).join("")}</div>`).join("")},
cult(){return CU.map(c=>`<div class=card><h3>${c[0]}</h3><p>${c[1]}</p><button onclick="say('${c[2].replace(/'/g,"")}')">🔊 ${c[2]}</button></div>`).join("")},
prof(){const e=Object.entries(S.wrong);return `<div class=card><h3>📊 Progrès (sur cet appareil)</h3><p>Points : ${S.pts} · Série : ${S.streak} j<br>Exercices : ${S.cnt.ex||0} · Jeux : ${S.cnt.jeu||0} · Vocabulaire : ${S.cnt.voc||0} · Dictées : ${S.cnt.dic||0}</p><p>Erreurs : ${e.length?e.map(([q,a])=>`<br>• ${esc(q)} → <b>${esc(a)}</b>`).join(""):"aucune"}</p><button onclick="S.wrong={};save();show('prof')">Vider les erreurs</button></div><div class=card><h3>➕ Ajouter un exercice</h3><input id=cq placeholder="Question"><input id=c0 placeholder="Bonne réponse"><input id=c1 placeholder="Mauvaise réponse 1"><input id=c2 placeholder="Mauvaise réponse 2 (facultatif)"><button class=pri onclick=ac()>Ajouter</button>${S.custom.map((c,i)=>`<p>• ${esc(c.q)} <button class=ic onclick="S.custom.splice(${i},1);save();show('prof')">🗑</button></p>`).join("")}</div><div class=card><h3>✍️ Textes des élèves</h3>${S.texts.map(x=>`<p><small class=mu>${x.d} · ${esc(x.p)}</small><br>${esc(x.t)}</p>`).join("")||"<p class=mu>Aucun texte.</p>"}</div><div class=card><h3>📝 Devoirs</h3><textarea id=hw rows=3 oninput="S.hw=this.value;save()">${esc(S.hw)}</textarea></div>`}};
const TB=[["home","🏠","Accueil"],["kap","📘","Kapitel"],["gram","📖","Grammaire"],["alpha","🔤","Alphabet"],["pron","🗣","Prononciation"],["spk","🎤","Sprechen"],["schr","✍️","Schreiben"],["voc","📚","Vocabulaire"],["ex","✏️","Exercices"],["games","🎮","Jeux"],["dial","💬","Dialogues"],["cult","🌍","Culture"],["prof","👩‍🏫","Prof"]];
function show(t){cur=t;$("#sr").hidden=true;$("#si").value="";clearInterval(T);try{speechSynthesis.cancel()}catch(e){}$("#main").innerHTML=R[t]();$("#nv").innerHTML=TB.map(x=>`<button class="${x[0]==t?"on":""}" onclick="show('${x[0]}')">${x[1]} ${x[2]}</button>`).join("")}
hdr();show("home");
</script></body></html>
