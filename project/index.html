<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Étymo · جذور الكلمات</title>
<style>
:root{--bg:#faf6ee;--cd:#fff;--tx:#2b2118;--mu:#7a6a58;--ac:#b4562c;--ok:#2f7d4f;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1713;--cd:#2a241d;--tx:#f1e8da;--mu:#b5a590;--ac:#e08a5a;--ok:#6fcf97;--bad:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1713;--cd:#2a241d;--tx:#f1e8da;--mu:#b5a590;--ac:#e08a5a;--ok:#6fcf97;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
#app{max-width:720px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.3rem;margin:0;color:var(--ac)}
.lg button{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.9rem}
.lg button.on{background:var(--ac);color:var(--bg)}
.sub{color:var(--mu);margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--cd);border:1px solid rgba(128,128,128,.25);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font-size:.95rem;color:var(--tx)}
.tile b{display:block;font-size:1.8rem}
.c{background:var(--cd);border:1px solid rgba(128,128,128,.25);border-radius:12px;padding:12px 14px;margin:8px 0}
.c small{color:var(--mu);display:block}
.w{color:var(--ac);font-weight:700}
.back{background:none;border:none;color:var(--ac);cursor:pointer;font-size:1rem;padding:6px 0}
button.o,button.act{display:block;width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid rgba(128,128,128,.4);background:var(--cd);color:var(--tx);font-size:1rem;cursor:pointer}
button.ok{background:var(--ok);color:#fff}button.bad{background:var(--bad);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.sel{outline:3px solid var(--ac)}button:disabled{opacity:.55}
.cd{position:relative;padding-inline-end:40px}.st{position:absolute;inset-inline-end:8px;top:6px;background:none;border:none;font-size:1.3rem;color:var(--ac);cursor:pointer}
.sq,select{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid rgba(128,128,128,.4);background:var(--cd);color:var(--tx);font-size:1rem;margin-bottom:8px}
pre{direction:ltr;white-space:pre-wrap;margin:0;font-family:inherit}@media print{button,.lg,.sq,.back{display:none}}
.cw{border-collapse:collapse;margin:8px auto}.cw td{width:34px;height:34px;padding:0;position:relative}.cw input{width:100%;height:100%;box-sizing:border-box;text-align:center;font-size:1.1rem;border:1px solid var(--mu);background:var(--cd);color:var(--tx);text-transform:uppercase;padding:0;border-radius:0}.cw sup{position:absolute;top:0;left:2px;font-size:.6rem;color:var(--mu);pointer-events:none;z-index:1}
:root{--ov:rgba(250,246,238,.84)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ov:rgba(27,23,19,.72)}}
:root[data-theme="dark"]{--ov:rgba(27,23,19,.72)}

const bd=()=>{const p=gp(),B=["مبتدئ|Novice|Novice","باحث|Chercheur|Explorer","أديب|Lettré|Scholar","لغوي|Linguiste|Linguist","حكيم|Sage|Sage"];let i=0;[0,50,150,300,500].forEach((v,j)=>{if(p>=v)i=j});return '🏅 '+$(B[i])[lang]};
function sp(i){try{const x=L[i];speechSynthesis.cancel();[[x[0],'ar'],[x[1].split(' /')[0],'fr'],[x[2].split(' /')[0],'en']].forEach(([s,l])=>{const u=new SpeechSynthesisUtterance(s);u.lang=l;speechSynthesis.speak(u)})}catch(e){}}
const ms=()=>{try{return JSON.parse(ld('er_m'))||[]}catch(e){return[]}};
function rvv(){const m=ms();return m.length?m.map(a=>{const x=L.find(y=>y[0]==a);return x?`<div class=c><span class=w>${x[0]}</span> → ${fw(x)} <button class=back onclick="rm('${a}')">✓</button></div>`:''}).join(''):'<p class=sub>✔</p>';}
function rm(a){sv('er_m',JSON.stringify(ms().filter(y=>y!=a)));draw();}
function wsv(){const a=sh(L).slice(0,10);return `<button class=act onclick="window.print()">🖨️</button>`+a.map((x,i)=>`<div class=c>${i+1}. <span class=w>${x[0]}</span> → ________ <span class=ans style="display:none">${fw(x)}</span></div>`).join('')+`<button class=act onclick="document.querySelectorAll('.ans').forEach(e=>e.style.display='inline')">${t('ak')}</button>`;}
function mv(n,title){let g=G[n];if(!g){g=G[n]={q:sh(QS[n]()).slice(0,n=='rc'?40:6),i:0,s:0,lock:0,end:n=='rc'?Date.now()+6e4:0};if(g.end)setTimeout(()=>{S[sec]&&S[sec][3]=='G'&&draw()},6e4)}
 let h=`<h3>${title}</h3>`;
 if(g.i>=g.q.length||(g.end&&Date.now()>g.end))return h+`<div class=c><b>${t('sc')}: ${g.s}</b><button class=act onclick="delete G.${n};draw()">${t('ag')}</button></div>`;
 const x=g.q[g.i];
 return h+`<div class=c><p>${x.p()}</p>${x.o.map(o=>`<button class=o onclick="mans('${n}',this,${o[0]==x.a})">${U[o[1]]?t(o[1]):o[1]}</button>`).join('')}</div>`;}
function mans(n,b,ok){const g=G[n];if(g.lock)return;g.lock=1;b.classList.add(ok?'ok':'bad');if(ok){g.s++;pts(n=='rc'?3:5)}else{const k=g.q[g.i].k;if(k&&!ms().includes(k))sv('er_m',JSON.stringify([...ms(),k]))}setTimeout(()=>{g.i++;g.lock=0;draw()},700);}
/* other sections */
const J=["قهوة: اليمن ← إسطنبول ← البندقية ← أوروبا (القرن 17).|café : Yémen → Istanbul → Venise → Europe (XVIIe s.).|coffee: Yemen → Istanbul → Venice → Europe (17th c.).","سكّر: الهند ← فارس ← العالم العربي ← الأندلس وصقلية ← أوروبا.|sucre : Inde → Perse → monde arabe → Andalousie et Sicile → Europe.|sugar: India → Persia → Arab world → Al-Andalus & Sicily → Europe.","صفر: الهند ← بغداد (الخوارزمي) ← أوروبا (فيبوناتشي).|zéro : Inde → Bagdad (al-Khwarizmi) → Europe (Fibonacci).|zero: India → Baghdad (al-Khwarizmi) → Europe (Fibonacci).",
"برتقال: من نارنج العربية ← nāraṅga السنسكريتية، وسقط حرف N في الفرنسية والإنجليزية.|orange : de l’arabe nāranj ← sanskrit nāraṅga ; le n initial s’est perdu.|orange: from Arabic nāranj ← Sanskrit nāraṅga; the initial n was lost.",
"شطرنج: الهند (chaturanga) ← فارس ← العرب ← إسبانيا (ajedrez) ← أوروبا.|échecs : Inde (chaturanga) → Perse → monde arabe → Espagne (ajedrez) → Europe.|chess: India (chaturanga) → Persia → Arab world → Spain (ajedrez) → Europe.",
"شاي: الصين (cha) ← فارس وتركيا (chay)؛ وtea من لهجة مين عبر الهولنديين.|thé : Chine (cha) → Perse/Turquie (chay) ; « tea » vient du min via les Néerlandais.|tea: China (cha) → Persia/Turkey (chay); 'tea' comes from Min Chinese via the Dutch.",
"قطن: العربية quṭn ← إسبانيا algodón ← فرنسا coton ← إنجلترا cotton.|coton : arabe quṭn → espagnol algodón → français coton → anglais cotton.|cotton: Arabic quṭn → Spanish algodón → French coton → English cotton."];
const TR=`Indo-European\n├ Germanic: English · Deutsch · Nederlands\n├ Romance: Français · Español · Italiano\n├ Slavic: Русский · Polski\n└ Indo-Iranian: हिन्दी · فارسی\n\nAfro-Asiatic\n├ Semitic: العربية · עברית · አማርኛ\n├ Berber: ⵜⴰⵎⴰⵣⵉⵖⵜ\n└ Egyptian → Coptic\n\nTurkic: Türkçe · Қазақша\nSino-Tibetan: 中文\nJaponic: 日本語\nIsolate: Euskara (Basque)`;
const CV=[["اليونان|Grèce|Greece","Zeus","Aphrodite","Hadès"],["روما|Rome|Rome","Jupiter","Vénus","Pluton"],["الشمال|Nord|Norse","Odin","Freyja","Hel"],["مصر|Égypte|Egypt","Ra","Hathor","Osiris"],["بلاد الرافدين|Mésopotamie|Mesopotamia","Anu","Ishtar","Ereshkigal"],["الهند|Inde|India","Indra","Kama","Yama"]];
const FL=["السماء|ciel|sky","الحب|amour|love","العالم السفلي|au-delà|underworld"];
let ca=0,cb=1;
function cmp(){const so=(v,n)=>`<select onchange="${n}=+this.value;draw()">${CV.map((c,i)=>`<option value=${i} ${i==v?'selected':''}>${$(c[0])[lang]}</option>`).join('')}</select>`;
 return `<div class=two>${so(ca,'ca')}${so(cb,'cb')}</div><div class=c><table width=100%>${FL.map((f,j)=>`<tr><td><small>${$(f)[lang]}</small></td><td class=w>${CV[ca][j+1]}</td><td class=w>${CV[cb][j+1]}</td></tr>`).join('')}</table></div>`;}
const KD=[["🍬",3],["☕",4],["🧵",5],["🏪",6],["🍊",8],["🥤",9]];
function body(k){
 if('LRMXCFE'.includes(k))return DD[k].map((_,i)=>card(k,i)).join('');
 if(k=='V'){const f=fv();return f.length?f.map(id=>card(id[0],+id.slice(1))).join(''):'<p class=sub>☆</p>'}
 if(k=='W')return cwv();
 if(k=='O')return omv();if(k=='P')return wsv();if(k=='N')return mapv();if(k=='Z')return RT.map(rcard).join('');if(k=='Q')return rvv();
 if(k=='J')return J.map(s=>`<div class=c>${$(s)[lang]}</div>`).join('');
 if(k=='T')return `<div class=c><pre>${TR}</pre></div>`;
 if(k=='Y')return cmp();
 if(k=='K')return `<div class=grid>${KD.map(([e,i])=>`<div class=tile><b style="font-size:2.6rem">${e}</b><span class=w>${L[i][0]}</span><br>${L[i][1].split(' /')[0]}<br>${L[i][2].split(' /')[0]}</div>`).join('')}</div>`;
 return body0(k);}
/* crossword */
let cw=null;
const nrm=(s,l)=>l?s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(' /')[0].replace(/[^A-Za-z]/g,'').toUpperCase():s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/^ال/,'');
function gen(){let best=null;
 for(let tr=0;tr<12;tr++){
  const ws=sh(L.filter(x=>lang||!/\s/.test(x[0]))).map(x=>({w:nrm(x[lang],lang),x})).filter(o=>o.w.length>=3).slice(0,9).sort((a,b)=>b.w.length-a.w.length);
  const g={},at=(r,c)=>g[r+','+c];
  const ok=(w,r,c,d)=>{const dr=d,dc=1-d;if(at(r-dr,c-dc)||at(r+dr*w.length,c+dc*w.length))return 0;let n=0;
   for(let i=0;i<w.length;i++){const rr=r+dr*i,cc=c+dc*i,v=at(rr,cc);
    if(v){if(v.l!=w[i]||v.d[d])return 0;n++}else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr))return 0}
   return n>0};
  const put=(o,r,c,d)=>{Object.assign(o,{r,c,d});for(let i=0;i<o.w.length;i++){const k=(r+d*i)+','+(c+(1-d)*i);(g[k]=g[k]||{l:o.w[i],d:[]}).d[d]=o}};
  const P=[];
  ws.forEach(o=>{if(!P.length){put(o,0,0,0);P.push(o);return}
   for(const p of sh(P)){let f=0;const d=1-p.d;
    for(let j=0;j<p.w.length&&!f;j++)for(let i=0;i<o.w.length&&!f;i++)if(o.w[i]==p.w[j]){
     const cr=p.r+p.d*j,cc=p.c+(1-p.d)*j,r=cr-d*i,c=cc-(1-d)*i;
     if(ok(o.w,r,c,d)){put(o,r,c,d);P.push(o);f=1}}
    if(f)break}});
  if(!best||P.length>best.P.length)best={g,P};
  if(P.length>=7)break}
 const {g,P}=best,ks=Object.keys(g).map(k=>k.split(',').map(Number));
 const r0=Math.min(...ks.map(a=>a[0])),r1=Math.max(...ks.map(a=>a[0])),c0=Math.min(...ks.map(a=>a[1])),c1=Math.max(...ks.map(a=>a[1]));
 P.sort((a,b)=>a.r-b.r||a.c-b.c);const num={};let n=0;P.forEach(o=>{const k=o.r+','+o.c;if(!num[k])num[k]=++n;o.n=num[k]});
 return {g,P,r0,r1,c0,c1,num,l:lang};}
function cwv(){if(!cw||cw.l!=lang)cw=gen();const {g,P,r0,r1,c0,c1,num}=cw;
 let h='<div style="overflow-x:auto;direction:ltr"><table class=cw>';
 for(let r=r0;r<=r1;r++){h+='<tr>';for(let x=c0;x<=c1;x++){const c=lang?x:c1-x+c0,k=r+','+c;h+=g[k]?`<td>${num[k]?`<sup>${num[k]}</sup>`:''}<input maxlength=1 data-k="${k}"></td>`:'<td></td>'}h+='</tr>'}
 h+=`</table></div><button class=act onclick="ck()">${t('ck')}</button><div id=cm></div><button class=act onclick="cw=null;draw()">${t('ag')}</button>`;
 const cl=d=>P.filter(o=>o.d==d).map(o=>`<div>${o.n}. ${t('cl')} ${lang?'« '+o.x[0]+' »':fw(o.x)} (${o.w.length})</div>`).join('');
 return h+`<div class=c><b>${t('ac')}</b>${cl(0)}<b>${t('dn')}</b>${cl(1)}</div>`;}
function ck(){let all=1;document.querySelectorAll('.cw input').forEach(i=>{const v=i.value.trim().toUpperCase(),good=v==cw.g[i.dataset.k].l;if(!good)all=0;i.style.background=good?'var(--ok)':v?'var(--bad)':'';i.style.color=v?'#fff':''});
 document.getElementById('cm').innerHTML=all?`<div class=c><b>${t('win')}</b></div>`:'';if(all&&!cw.done){cw.done=1;pts(20)}}
draw();
</script></body></html>
