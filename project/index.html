.c{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.brand{flex:0 0 100%;display:flex;justify-content:center;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#111a26,#070b10);border:1px solid rgba(140,125,255,.35);box-shadow:0 0 26px rgba(91,75,219,.28)}
.logo{display:block;height:168px;width:auto;max-width:100%;object-fit:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.sb{display:flex;align-items:center;gap:8px;height:54px;margin:4px 14px 10px;padding:0 6px 0 14px;border:1.5px solid transparent;border-radius:999px;background:linear-gradient(rgba(8,12,34,.9),rgba(8,12,34,.9)) padding-box,linear-gradient(90deg,#27d3ff,#5b6cff,#c04bff) border-box;box-shadow:0 0 18px rgba(80,120,255,.32);transition:box-shadow .2s}
.sb:focus-within{box-shadow:0 0 26px rgba(110,130,255,.6)}
.sbi{flex:none;width:22px;height:22px;color:#5fd8f0}
.sbd{flex:none;width:1px;height:26px;background:rgba(160,170,210,.35)}
#q{flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;color:#eceefa;font-size:14px}
#q::placeholder{color:#8b93b8;opacity:1;font-size:13.5px}
#sbtn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2bb4ff,#8a4bff 60%,#d946ef);box-shadow:0 0 12px rgba(138,75,255,.55)}
#sbtn svg{width:21px;height:21px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px}
.tabs button,.sub button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sub{display:flex;gap:6px;padding:0 14px 8px}
.sub button{flex:1;border-radius:10px;padding:7px 4px;font-size:13px}
.sub button.on{background:var(--ac2);color:var(--ac);border-color:var(--ac);font-weight:600}
main{padding:0 14px 30px;max-width:760px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.c h3{margin:0 0 4px;font-size:15px}
.c p{margin:0;color:var(--mu);font-size:14px}
a.c{display:block;text-decoration:none;color:inherit}
a.c b{color:var(--ac)}
.tag{font-size:11px;background:var(--ac2);color:var(--ac);padding:2px 8px;border-radius:10px;margin-inline-end:6px}
.empty{text-align:center;color:var(--mu);padding:30px}
h2{font-size:15px;margin:14px 0 8px;color:var(--ac)}
.star{float:inline-end;cursor:pointer;font-size:19px;margin-inline-start:6px}
.c input{width:100%;margin:4px 0;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.c button{border:1px solid var(--bd);background:var(--ac2);color:var(--ac);border-radius:8px;padding:5px 12px;margin-top:8px;cursor:pointer}
.opt{display:block;width:100%;text-align:start;margin-bottom:8px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
#th{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 10px;border-radius:8px;cursor:pointer}
.nt,.sp{float:inline-end;cursor:pointer;font-size:16px;margin-inline-start:6px}.note{margin-top:6px!important;padding:6px 8px;border-radius:8px;background:var(--ac2);color:var(--tx)!important}.c textarea,.c select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
</style>
</head>
