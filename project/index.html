<style>

body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;max-width:720px;padding:0 14px 40px}

nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.card,details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:9px 0}
summary{cursor:pointer;font-weight:600}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:10px;padding:2px 9px;font-size:.78rem;margin:2px 4px 2px 0;font-weight:400}

ul{padding-left:20px;margin:4px 0}

.btn{background:var(--ac);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-size:1rem;cursor:pointer}

:root[data-theme="dark"] #fond{opacity:.3}
summary{display:flex;align-items:center;gap:10px;list-style:none}

.av,.cv{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;background:var(--ac2) center/cover no-repeat;border:2px solid var(--ac);color:var(--ac);font-weight:700}

.sm{background:var(--ac2);color:var(--ac);border:1px solid var(--bd);border-radius:18px;padding:6px 12px;font-size:.85rem;cursor:pointer;text-decoration:none;font-family:inherit}
#viewer{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;overflow:hidden;color:#fff;background:radial-gradient(circle at 30% 20%,#4a3320,#0d0906)}

<h1>🏺 Mythologies du monde</h1>
<p class="sub">25 grandes traditions : dieux, créatures, récits et héritage</p>
<nav id="nav"></nav>
<main id="main"></main>
<div id="viewer"><div id="vbg"></div><div id="vm"></div><button class="sm" id="vx">✕ Fermer</button><div id="vb"><h2 id="vt"></h2><p id="vs"></p><div id="vp"><i></i></div><div class="acts"><button class="sm" id="vpl">⏸ Pause</button><button class="sm" id="vmu">🎵 Ambiance</button></div><small id="vc"></small></div></div>
<script>
var M=[
['Grecque','Europe','Antiquité, bassin égéen','Au début, le Chaos ; naissent Gaïa (la Terre), le Tartare et Éros. Ouranos règne, puis Cronos, puis Zeus après la guerre des Titans.',['Zeus : ciel et foudre','Héra : mariage','Poséidon : mers','Hadès : monde souterrain','Athéna : sagesse et stratégie','Apollon : lumière et arts','Artémis : chasse','Aphrodite : amour','Hermès : messager'],['Minotaure','Cerbère','Méduse','Hydre de Lerne','Centaures','Sirènes'],'Les douze travaux d’Héraclès, la guerre de Troie, le voyage d’Ulysse.','Des mots comme panique (Pan), écho, océan ; les Jeux olympiques.','🏛️'],
['Romaine','Europe','Antiquité, Rome','Rome est fondée par Romulus après la mort de son frère Rémus, jumeaux allaités par une louve. Les dieux sont largement assimilés aux dieux grecs.',['Jupiter : roi des dieux','Junon : mariage','Neptune : mers','Pluton : enfers','Minerve : sagesse','Mars : guerre','Vénus : amour','Mercure : messager','Janus : passages et débuts'],['Louve capitoline','Harpies','Cerbère'],'L’Énéide : Énée fuit Troie et prépare la fondation de Rome.','Planètes (Mars, Vénus, Jupiter) et mois (janvier vient de Janus).','🦅'],
['Égyptienne','Afrique','Antiquité, vallée du Nil','Au commencement, l’océan Noun. Une butte en émerge et le dieu créateur (Atoum ou Rê selon les cités) donne naissance aux autres dieux.',['Rê : soleil','Osiris : mort et renaissance','Isis : magie','Horus : ciel et royauté','Seth : désordre','Anubis : embaumement','Thot : écriture et savoir','Hathor : amour et musique','Maât : justice'],['Apophis (serpent du chaos)','Sphinx','Ammout (dévoreuse)'],'Osiris est tué par Seth, ramené par Isis ; Horus reprend le trône. Après la mort, le cœur est pesé contre la plume de Maât.','Momification, Livre des morts, pyramides.','𓂀'],
['Nordique','Europe','Scandinavie, époque viking','Dans le vide Ginnungagap, la glace du nord rencontre le feu du sud. Naît le géant Ymir, tué par Odin et ses frères qui façonnent le monde avec son corps. Neuf mondes sont portés par l’arbre Yggdrasil.',['Odin : sagesse, guerre, runes','Thor : tonnerre (marteau Mjöllnir)','Freyja : amour et magie','Freyr : fertilité','Loki : ruse','Baldr : lumière','Tyr : justice et guerre','Heimdall : gardien du pont','Hel : monde des morts'],['Fenrir (loup)','Jörmungandr (serpent)','Sleipnir (cheval à huit pattes)','Valkyries','Nains','Elfes'],'Le Ragnarök : bataille finale, fin du monde, puis renaissance.','En anglais, Wednesday, Thursday et Friday viennent d’Odin, de Thor et de Frigg.','⚡'],
['Celtique','Europe','Irlande, Pays de Galles, Gaule','Pas de texte unique : les récits viennent des Irlandais, des Gallois et des Gaulois. Les Tuatha Dé Danann, peuple des dieux, occupent l’Irlande.',['Dagda : père et abondance','Lugh : maître de tous les arts','Brigid : poésie et forge','Morrigan : guerre','Cernunnos : dieu cornu des forêts','Taranis : tonnerre','Épona : chevaux'],['Banshee','Sidhe (peuple des collines)','Selkies','Pooka'],'Cycle d’Ulster avec le héros Cú Chulainn ; Mabinogion gallois ; légende du roi Arthur.','La fête de Samain est à l’origine d’Halloween.','🍀'],
['Mésopotamienne','Moyen-Orient','Sumer, Akkad, Babylone','Dans l’Enuma Elish, l’eau douce Apsû et l’eau salée Tiamat donnent naissance aux dieux. Marduk tue Tiamat et crée le ciel et la terre avec son corps.',['Anu : ciel','Enlil : air et tempête','Enki (Ea) : eaux douces et sagesse','Inanna (Ishtar) : amour et guerre','Shamash : soleil et justice','Sîn : lune','Marduk : dieu de Babylone','Ereshkigal : monde souterrain'],['Lamassu (taureau ailé gardien)','Humbaba','Pazuzu'],'L’Épopée de Gilgamesh : amitié avec Enkidu, quête d’immortalité et déluge d’Utnapishtim.','L’un des plus anciens textes littéraires connus.','🌙'],
['Hindoue','Asie','Inde, de l’Antiquité à aujourd’hui','Création et destruction se répètent en cycles infinis. Brahma naît d’un lotus sorti du nombril de Vishnu endormi.',['Brahma : créateur','Vishnu : préservateur (avatars Rama et Krishna)','Shiva : destructeur et transformateur','Lakshmi : prospérité','Saraswati : savoir','Durga et Kali : formes de la Déesse','Ganesh : obstacles','Hanuman : force et dévotion','Indra : tonnerre'],['Nagas (serpents)','Garuda (oiseau)','Asuras','Rakshasas'],'Le Ramayana et le Mahabharata, qui contient la Bhagavad-Gita.','Diwali, Holi, yoga. Religion vivante : on parle ici de ses récits.','🪷'],
['Chinoise','Asie','Chine ancienne et populaire','Pangu naît dans un œuf cosmique et sépare le ciel de la terre en grandissant pendant des milliers d’années. Son corps forme montagnes et fleuves.',['Nüwa : crée les humains, répare le ciel','Fuxi : civilisation','Empereur de Jade : souverain du ciel','Xiwangmu : Reine mère de l’Ouest','Chang’e : déesse de la Lune','Guan Yu : loyauté','Sun Wukong : le Roi Singe'],['Dragon (Long)','Phénix (Fenghuang)','Qilin','Tortue noire'],'L’archer Yi abat neuf des dix soleils ; Voyage en Occident.','Zodiaque chinois, fête de la mi-automne.','🐉'],
['Japonaise','Asie','Japon, Kojiki et Nihon shoki','Izanagi et Izanami créent les îles du Japon. Izanami meurt et descend au Yomi. De la purification d’Izanagi naissent Amaterasu, Tsukuyomi et Susanoo.',['Amaterasu : soleil','Tsukuyomi : lune','Susanoo : tempêtes','Inari : riz et prospérité','Raijin : tonnerre','Fujin : vent','Ebisu : chance'],['Kitsune (renard)','Tengu','Oni','Kappa','Tanuki'],'Amaterasu se cache dans une grotte, le monde sombre ; une fête et un miroir la font revenir.','Shintoïsme, yokai dans les mangas et les animés.','🦊'],
['Turco-mongole','Asie','Steppe d’Asie centrale','Le Tengrisme vénère Tengri, le Ciel éternel, et la Terre-Eau. Le chamane relie les mondes.',['Tengri : ciel éternel','Umay : fécondité et foyer','Erlik : monde souterrain'],['Loup gris','Aigle'],'L’Histoire secrète des Mongols fait descendre ce peuple d’un loup bleu et d’une biche fauve.','Le loup reste un symbole fort dans la région.','🐺'],
['Aztèque','Amériques','Mexique central','Le monde a connu quatre « soleils » (ères) détruits. Nous vivons dans le cinquième, le Soleil de mouvement.',['Quetzalcoatl : serpent à plumes, vent et savoir','Huitzilopochtli : soleil et guerre','Tezcatlipoca : miroir fumant, nuit','Tlaloc : pluie','Coatlicue : mère des dieux','Mictlantecuhtli : mort'],['Cipactli (monstre de la terre)','Xolotl (chien)'],'Fondation de Tenochtitlan à l’endroit où un aigle posé sur un nopal tient un serpent.','Les mots chocolat, tomate et avocat viennent du nahuatl.','🦅'],
['Maya','Amériques','Mésoamérique','Selon le Popol Vuh, les dieux essaient de créer l’humanité en terre, puis en bois, avant de réussir avec le maïs.',['Itzamná : créateur et savoir','Kukulkan : serpent à plumes','Chaac : pluie','Ixchel : lune et médecine','Hunahpu et Xbalanqué : jumeaux héros'],['Seigneurs de Xibalba','Vucub Caquix (oiseau géant)'],'Les jumeaux Hunahpu et Xbalanqué défient les seigneurs de Xibalba, le monde souterrain.','Calendrier maya ; à Chichén Itzá, l’ombre d’un serpent apparaît sur la pyramide aux équinoxes.','🌽'],
['Inca','Amériques','Andes','Viracocha crée le monde, le soleil et la lune à partir du lac Titicaca. Trois mondes : Hanan Pacha (ciel), Kay Pacha (terre), Ukhu Pacha (dessous).',['Inti : soleil, ancêtre des empereurs','Viracocha : créateur','Pachamama : terre mère','Mama Quilla : lune','Illapa : foudre'],['Condor','Puma','Amaru (serpent)'],'Manco Cápac et Mama Ocllo sortent du lac Titicaca et fondent Cuzco.','Machu Picchu, fête de l’Inti Raymi.','☀️'],
['Amérindiennes du Nord','Amériques','Amérique du Nord, centaines de peuples','Les récits varient beaucoup. Chez les Haudenosaunee, la Terre naît sur le dos d’une grande tortue. Les Lakota parlent de Wakan Tanka, le Grand Mystère.',['Corbeau : créateur et farceur (côte nord-ouest)','Coyote : farceur de plusieurs nations','Oiseau-Tonnerre : tempêtes','Femme Bison blanc (Lakota) : donne la pipe sacrée','Nanabozho (Anishinaabe) : héros transformateur'],['Wendigo','Oiseau-Tonnerre'],'Une femme tombée du ciel est accueillie par les animaux sur le dos de la tortue.','Traditions vivantes : chaque nation a ses propres récits.','🪶'],
['Inuit','Amériques','Arctique','Sedna, Sila et Tarqeq structurent le monde des chasseurs de l’Arctique. Les angakkuit (chamanes) voyagent entre les mondes.',['Sedna : déesse de la mer et des animaux marins','Sila : souffle du monde','Tarqeq : lune','Malina : soleil'],['Qalupalik (créature de la mer)'],'Sedna est jetée à la mer par son père ; ses doigts deviennent phoques et baleines. Le chamane la visite pour la calmer.','Les aurores boréales sont parfois vues comme des esprits.','❄️'],
['Slave','Europe','Europe de l’Est','Peu de sources anciennes : une grande partie est reconstituée à partir du folklore et de chroniques tardives.',['Perun : tonnerre et chêne','Veles : bétail, eaux et monde souterrain','Mokosh : déesse mère','Dazhbog : soleil'],['Baba Yaga (maison sur pattes de poulet)','Domovoï','Rusalka','Koschei l’Immortel','Oiseau de feu'],'Contes de Baba Yaga et de l’Oiseau de feu.','Très présent dans les contes russes et polonais.','🌲'],
['Perse (Zoroastrisme)','Moyen-Orient','Iran ancien','Ahura Mazda, seigneur de la sagesse, s’oppose à Angra Mainyu, esprit du mal. Le monde est un combat entre lumière et ténèbres.',['Ahura Mazda : sagesse et bien','Angra Mainyu : mal','Mithra : alliance et lumière','Anahita : eaux'],['Simurgh (oiseau géant)','Zahhak (serpents sur les épaules)'],'Le Shahnameh de Ferdowsi : héros Rostam, rois et monstres.','Le dualisme bien/mal a marqué d’autres traditions. Religion toujours pratiquée.','🔥'],
['Arabe et djinns','Moyen-Orient','Péninsule arabique','Avant l’islam, des divinités comme Hubal, Allat, Al-Uzza et Manat étaient vénérées. Les djinns, êtres de feu sans fumée, sont restés dans les croyances et les contes.',['Allat','Al-Uzza','Manat','Hubal'],['Djinns','Ghoul','Roc (oiseau géant)'],'Les Mille et Une Nuits : Shéhérazade, Sindbad, génies et lampes.','Le mot génie vient de djinn par un jeu de langue.','🧞'],
['Africaine (Yoruba, Akan, Dogon…)','Afrique','Afrique subsaharienne','Les traditions sont très variées. Chez les Yoruba, Olodumare est le créateur et Obatala sculpte les humains.',['Olodumare : créateur (Yoruba)','Shango : tonnerre','Yemoja : mer et maternité','Ogun : fer et forge','Oshun : rivière et amour','Eshu : messager','Nyame : ciel (Akan)','Unkulunkulu : premier ancêtre (zoulou)'],['Anansi (araignée conteuse)','Mami Wata','Tokoloshe'],'Anansi l’araignée gagne les histoires du dieu du ciel.','Les orishas voyagent vers les Amériques : candomblé, santería.','🕷️'],
['Aborigène d’Australie','Océanie','Australie, centaines de nations','Le Temps du Rêve : des ancêtres créateurs traversent la terre et façonnent paysages, animaux et lois. Les pistes (songlines) racontent ces voyages.',['Serpent arc-en-ciel : eau et création','Baiame : créateur (sud-est)'],['Serpent arc-en-ciel'],'Chaque lieu, comme Uluru, a son histoire d’ancêtre.','Un seul mot, Dreamtime, cache de nombreuses traditions différentes.','🌈'],
['Polynésienne et maorie','Océanie','Pacifique, Nouvelle-Zélande, Hawaï','Chez les Maoris, Rangi (ciel) et Papa (terre) sont enlacés. Leurs enfants, dont Tāne, les séparent et la lumière entre dans le monde.',['Tāne : forêts et vie','Tangaroa : mer','Māui : héros et farceur','Pelé : volcans (Hawaï)','Hine-nui-te-pō : mort'],['Taniwha (esprits des eaux)'],'Māui pêche une île avec son hameçon et ralentit le soleil.','Récits de navigation entre les îles du Pacifique.','🌊'],
['Finnoise (Kalevala)','Europe','Finlande, chants recueillis au XIXe siècle','Selon le Kalevala, la déesse de l’air Ilmatar attend sur la mer. Un canard pond des œufs sur son genou ; en se brisant, ils forment le ciel et la terre.',['Väinämöinen : sage et chanteur','Ilmarinen : forgeron du Sampo','Lemminkäinen : héros','Louhi : sorcière du Nord','Ukko : tonnerre'],['Oiseaux et ours sacrés'],'Les héros forgent puis se disputent le Sampo, objet magique de prospérité.','Tolkien s’en est inspiré pour ses langues et récits.','🦆']
];
var S={
'Zeus':'Fils de Cronos et de Rhéa, il échappe enfant à son père qui dévorait ses enfants. Devenu adulte, il force Cronos à les recracher, mène la guerre contre les Titans et partage le monde avec ses frères : le ciel pour lui, la mer pour Poséidon, les enfers pour Hadès. Il règne depuis l’Olympe, mais ses nombreuses aventures attisent la colère d’Héra.',
'Athéna':'Née tout armée du crâne de Zeus, qui avait avalé sa mère Métis. Déesse de la stratégie, elle guide Ulysse, Persée et Héraclès. Elle dispute à Poséidon le patronage d’Athènes et l’emporte en offrant l’olivier à la cité.',
'Hadès':'Frère de Zeus, il reçoit les enfers au tirage au sort. Il enlève Perséphone, fille de Déméter ; la terre devient stérile jusqu’à ce qu’un accord soit trouvé : Perséphone passera une partie de l’année sous terre, ce qui explique les saisons.',
'Hermès':'Dès le jour de sa naissance, il vole les bœufs d’Apollon puis invente la lyre avec une carapace de tortue pour se faire pardonner. Messager des dieux, il guide aussi les âmes vers les enfers.',
'Mars':'Dieu romain de la guerre, père de Romulus et Rémus selon la légende, donc ancêtre des Romains. À l’origine il protège aussi les récoltes ; le Champ de Mars et le mois de mars lui sont consacrés.',
'Janus':'Dieu à deux visages, l’un tourné vers le passé, l’autre vers l’avenir. À Rome, les portes de son temple restaient ouvertes en temps de guerre et closes en temps de paix. On l’invoquait en premier lors des cérémonies.',
'Osiris':'Roi bon qui enseigne l’agriculture aux Égyptiens. Son frère Seth, jaloux, l’enferme dans un coffre jeté au Nil, puis démembre son corps. Isis rassemble les morceaux et le ramène assez longtemps à la vie pour concevoir Horus. Osiris devient le roi des morts.',
'Isis':'Épouse d’Osiris et grande magicienne. Elle retrouve le coffre de son époux jusqu’à Byblos, cache le petit Horus dans les marais du Delta et obtient par ruse le nom secret de Rê, source de grand pouvoir.',
'Horus':'Élevé en secret, il affronte Seth devant le tribunal des dieux, au fil de longs combats. Il perd un œil, restauré par Thot (l’œil oudjat), et obtient le trône. Chaque pharaon est vu comme son incarnation.',
'Anubis':'Dieu à tête de chacal, protecteur des embaumeurs. Il guide les morts dans l’au-delà et surveille la pesée du cœur contre la plume de Maât.',
'Odin':'Pour gagner la sagesse, il sacrifie un œil à la source de Mimir, puis se pend neuf nuits à Yggdrasil et découvre les runes. Ses corbeaux Hugin et Munin lui rapportent les nouvelles du monde. Il sait que le Ragnarök viendra et prépare ses guerriers au Valhalla.',
'Thor':'Protecteur d’Asgard, il combat les géants avec son marteau Mjöllnir. Quand un géant le lui vole, Thor se déguise en mariée pour le récupérer. Au Ragnarök, il tue le serpent Jörmungandr mais succombe à son venin.',
'Loki':'Dieu ruseur, tantôt allié, tantôt ennemi des dieux. Il provoque la mort de Baldr en guidant la main de Höd avec une branche de gui. Enchaîné, un serpent verse du venin sur son visage ; il se libérera au Ragnarök.',
'Dagda':'Grand dieu-père des Tuatha Dé Danann. Il possède un chaudron qui ne se vide jamais et une massue : un bout tue, l’autre ressuscite. Il aide son peuple contre les Fomoires.',
'Lugh':'Il se présente à la cour du roi Nuada comme maître de tous les arts. À la seconde bataille de Mag Tuired, il tue Balor à l’œil maléfique et mène les dieux à la victoire.',
'Marduk':'Menacés par Tiamat, les dieux offrent la royauté à Marduk. Il la vainc avec les vents, coupe son corps en deux pour former ciel et terre, puis crée les humains avec le sang du dieu Kingu afin qu’ils servent les dieux.',
'Inanna (Ishtar)':'Elle descend aux enfers voir sa sœur Ereshkigal et doit abandonner un vêtement à chacune des sept portes. Tuée, elle est ramenée à la vie par Enki, mais doit fournir un remplaçant : elle choisit son époux Dumuzi, qui passe une moitié de l’année aux enfers.',
'Vishnu':'Dieu qui préserve le monde. Quand le dharma décline, il descend sous forme d’avatars : le poisson Matsya qui sauve Manu du déluge, la tortue, le sanglier, puis Rama et Krishna.',
'Shiva':'Ascète du mont Kailash, époux de Parvati, il danse la création et la destruction (Nataraja). Il avale le poison né du barattage de l’océan : sa gorge en devient bleue.',
'Ganesh':'Parvati le façonne avec la pâte de son corps pour garder sa porte. Shiva, ne le reconnaissant pas, lui coupe la tête, puis le ramène à la vie avec une tête d’éléphant. Il est invoqué avant tout nouveau début.',
'Hanuman':'Singe dévoué à Rama, il franchit l’océan d’un bond pour retrouver Sita, incendie Lanka avec sa queue en flammes et rapporte une montagne entière de plantes pour soigner les blessés.',
'Nüwa':'Elle façonne les premiers humains dans l’argile. Quand le ciel se fend, elle le répare avec des pierres de cinq couleurs et soutient la voûte avec les pattes d’une tortue géante.',
'Chang’e':'Elle boit l’élixir d’immortalité de son époux, l’archer Hou Yi, et s’élève jusqu’à la Lune où elle vit avec un lièvre de jade. La fête de la mi-automne lui est associée.',
'Sun Wukong':'Roi singe né d’une pierre, il apprend l’immortalité et sème le désordre au Ciel. Bouddha l’emprisonne cinq cents ans sous une montagne. Libéré, il accompagne le moine Tang Sanzang vers l’Inde dans le roman La Pérégrination vers l’Ouest.',
'Amaterasu':'Offensée par son frère Susanoo, elle se cache dans une grotte et le monde sombre. Les dieux font la fête, Uzume danse, les rires intriguent Amaterasu ; elle sort, voit son reflet dans un miroir, et la lumière revient. Elle est l’ancêtre de la famille impériale.',
'Susanoo':'Chassé du ciel, il tue le serpent à huit têtes Yamata no Orochi, trouve l’épée Kusanagi dans sa queue et sauve la princesse Kushinada.',
'Quetzalcoatl':'Il descend au Mictlan chercher les os des anciens humains et les arrose de son sang pour recréer l’humanité. Il offre aussi le maïs. Selon un récit, Tezcatlipoca le trompe ; il s’exile vers l’est en promettant de revenir.',
'Tezcatlipoca':'Dieu de la nuit au « miroir fumant », rival de Quetzalcoatl. Il perd un pied en combattant le monstre de la terre. Il piège Quetzalcoatl en lui présentant un miroir et une boisson.',
'Huitzilopochtli':'Il naît adulte et armé du ventre de Coatlicue. Il tue sa sœur Coyolxauhqui et ses quatre cents frères qui menaçaient sa mère. Dieu soleil guerrier, il est au cœur du Templo Mayor.',
'Hunahpu et Xbalanqué':'Jumeaux du Popol Vuh, ils descendent à Xibalba et surmontent les épreuves des seigneurs de la mort (maison des ténèbres, du froid, des jaguars) grâce à la ruse. Ils meurent, renaissent en magiciens et vainquent les seigneurs ; ils deviennent ensuite le soleil et la lune.',
'Viracocha':'Il surgit du lac Titicaca et crée le monde. Mécontent de ses premiers humains de pierre, il les noie et en refait en argile. Il parcourt le pays en mendiant, puis s’en va sur la mer.',
'Inti':'Dieu soleil, père des Incas. Il envoie Manco Capac et Mama Ocllo avec un bâton d’or : là où il s’enfonce dans le sol, ils fondent Cuzco.',
'Corbeau':'Il se transforme en aiguille de pin, se fait avaler par la fille d’un chef et renaît bébé. Il réclame la boîte contenant la lumière, puis s’enfuit en corbeau par l’ouverture de la maison : la lumière éclaire le monde.',
'Coyote':'Farceur et créateur. Il vole le feu aux êtres du ciel pour les humains, mais ses ruses se retournent souvent contre lui.',
'Sedna':'Elle refuse tous ses prétendants, épouse un oiseau trompeur et son père vient la chercher en bateau. Dans la tempête, il la jette à l’eau et coupe ses doigts : ils deviennent phoques et baleines. Elle règne au fond de la mer ; le chaman doit peigner ses cheveux pour l’apaiser.',
'Perun':'Dieu du tonnerre qui vit au sommet du chêne du monde. Il combat Veles, dieu des eaux, qui lui vole son bétail, et le poursuit avec la foudre : la pluie qui suit renouvelle la terre.',
'Ahura Mazda':'Dieu bon et créateur, face à Angra Mainyu, esprit destructeur. Le monde est le champ de lutte entre la vérité (asha) et le mensonge (druj) ; à la fin des temps, le bien triomphera.',
'Shango':'Roi d’Oyo, devenu dieu du tonnerre après sa disparition. Il porte une hache double et ses épouses sont Oya, Oshun et Oba.',
'Eshu':'Gardien des carrefours et messager entre les humains et les orishas. Il porte un chapeau mi-rouge, mi-noir, et brouille deux amis qui le voient chacun d’une couleur différente.',
'Serpent arc-en-ciel':'Au Temps du Rêve, il s’éveille sous la terre et rampe à travers le paysage, creusant rivières et gorges. Protecteur des points d’eau, il punit ceux qui les profanent.',
'Māui':'Il pêche les îles avec un hameçon magique, ralentit le soleil avec des cordes et vole le feu. Il tente de gagner l’immortalité en traversant Hine-nui-te-pō, déesse de la mort endormie ; un oiseau rit, elle s’éveille et le tue.',
'Pelé':'Déesse du volcan. Chassée de Tahiti par sa sœur Namaka, elle creuse des cratères d’île en île avant de s’installer au Kīlauea. Sa colère se manifeste par la lave.',
'Väinämöinen':'Vieux sage chanteur dont la voix ensorcelle. Il fabrique le kantele avec une mâchoire de brochet et part chercher une épouse chez Louhi, mais ne peut forger lui-même le Sampo.',
'Ilmarinen':'Forgeron qui a forgé la voûte du ciel. Il fabrique le Sampo pour Louhi afin d’obtenir sa fille, mais le mariage tourne mal.'
};
Object.assign(S,{
'Kukulkan':'Serpent à plumes maya, équivalent de Quetzalcoatl. À Chichén Itzá, aux équinoxes, l’ombre de la pyramide dessine un serpent qui descend l’escalier du temple.',
'Héra':'Reine des dieux et protectrice du mariage. Trahie sans cesse par Zeus, elle poursuit ses amantes et leurs enfants de sa colère, notamment Héraclès, à qui elle impose la folie qui mène à ses douze travaux.',
'Poséidon':'Dieu de la mer et des séismes, il frappe le sol de son trident. Il dispute Athènes à Athéna et perd. Il poursuit Ulysse de sa rancune après que le héros a aveuglé son fils, le cyclope Polyphème.',
'Apollon':'Jumeau d’Artémis, il tue le serpent Python à Delphes et y fonde l’oracle le plus célèbre de Grèce. Dieu de la lumière, de la musique et de la médecine, il guide les Muses.',
'Artémis':'Déesse vierge de la chasse et de la Lune, sœur d’Apollon. Surpris à la regarder se baigner, le chasseur Actéon est changé en cerf et dévoré par ses propres chiens.',
'Aphrodite':'Née de l’écume de la mer, déesse de l’amour. Elle promet à Pâris la plus belle des femmes, Hélène, s’il la désigne comme la plus belle déesse : cette décision déclenche la guerre de Troie.',
'Jupiter':'Roi des dieux romains, honoré au Capitole. Il garantit les serments et la puissance de Rome ; les généraux victorieux lui offrent un triomphe.',
'Junon':'Épouse de Jupiter, protectrice des femmes, du mariage et de l’État romain. Les oies sacrées de son temple alertent les Romains lors de l’attaque gauloise du Capitole.',
'Neptune':'Dieu romain des eaux et des chevaux. Les Neptunales, en été, célèbrent sa fête avec des cabanes de feuillage pour se protéger de la chaleur.',
'Pluton':'Dieu romain des enfers, riche des trésors du sous-sol. Il enlève Proserpine, ce qui explique le retour du printemps, quand elle remonte vers sa mère Cérès.',
'Minerve':'Déesse romaine de la sagesse, des artisans et de la guerre juste, honorée sur le Capitole avec Jupiter et Junon.',
'Vénus':'Mère du héros Énée, elle est l’ancêtre mythique des Romains ; Jules César prétendait descendre d’elle. Elle règne sur l’amour, la beauté et le jardin.',
'Mercure':'Dieu des marchands et des voyageurs, messager rapide aux sandales ailées. Son temple se tenait près du Grand Cirque et les commerçants l’invoquaient pour leurs affaires.',
'Rê':'Dieu soleil, il traverse le ciel sur sa barque le jour et les enfers la nuit, où il combat chaque fois le serpent Apophis. Il renaît à l’aube. Il se fatigue, vieillit, et se retire dans le ciel.',
'Seth':'Seigneur du désert, des orages et du désordre. Il tue Osiris par jalousie, mais défend aussi la barque de Rê contre Apophis. Il combat Horus pour le trône.',
'Thot':'Dieu à tête d’ibis, scribe des dieux et maître de l’écriture, du calcul et de la Lune. Il soigne l’œil d’Horus blessé par Seth et note le verdict de la pesée des cœurs.',
'Hathor':'Déesse de l’amour, de la musique et de la joie. Sous la forme de Sekhmet, elle massacre les humains sur ordre de Rê ; il l’arrête en inondant la terre de bière teintée de rouge, qu’elle boit.',
'Maât':'Déesse de la vérité et de l’ordre du monde, représentée avec une plume sur la tête. Au tribunal des morts, le cœur du défunt est pesé contre sa plume : plus léger, il accède à l’éternité.',
'Freyja':'Déesse du Vanaheim, elle voyage dans un char tiré par des chats et porte le collier Brísingamen. Elle accueille dans sa salle la moitié des guerriers morts au combat.',
'Freyr':'Dieu de la fertilité. Pour séduire la géante Gerd, il donne son épée magique à son serviteur et se retrouve sans arme au Ragnarök, où il combat avec un bois de cerf.',
'Baldr':'Dieu de la lumière, beau et aimé. Sa mère Frigg obtient le serment de tous les êtres de ne pas lui nuire, sauf le gui. Loki en fait une flèche : Baldr meurt, et son deuil annonce la fin des dieux.',
'Tyr':'Dieu du courage et de la justice. Pour tromper le loup Fenrir, il place sa main dans sa gueule en gage de bonne foi ; les dieux enchaînent le loup, qui lui arrache la main.',
'Heimdall':'Gardien du pont arc-en-ciel Bifröst, il entend l’herbe pousser et voit à des centaines de lieues. Au Ragnarök, il sonnera du cor Gjallarhorn pour avertir les dieux.',
'Hel':'Fille de Loki, elle règne sur Helheim, séjour des morts de maladie ou de vieillesse. Elle accepte de rendre Baldr si tous les êtres le pleurent ; une géante refuse et le dieu reste mort.',
'Brigid':'Fille du Dagda, déesse de la poésie, de la forge et de la guérison. Sa fête Imbolc marque le début du printemps ; elle devient plus tard sainte Brigitte en Irlande.',
'Morrigan':'Déesse corbeau de la guerre et du destin. Elle propose son amour à Cú Chulainn qui la refuse ; elle l’attaque alors sous forme d’anguille, de louve et de génisse. Elle apparaît lavant les armes de ceux qui vont mourir.',
'Cernunnos':'Dieu aux bois de cerf, assis jambes croisées, entouré d’animaux, avec un torque. Maître de la nature sauvage et de l’abondance, il figure sur le pilier des Nautes à Paris.',
'Taranis':'Dieu gaulois du tonnerre, représenté avec une roue et un foudre. Les Romains le rapprochent de Jupiter.',
'Épona':'Déesse gauloise des chevaux, représentée sur une jument. Protectrice des cavaliers et des voyageurs, elle est aussi adoptée par la cavalerie romaine, un cas rare de dieu celte honoré dans tout l’Empire.',
'Anu':'Dieu du ciel, père des dieux, siège de la royauté divine. Il lance le Taureau céleste contre Gilgamesh quand celui-ci repousse les avances de sa fille Ishtar.',
'Enlil':'Dieu de l’air et du vent, maître du destin. Gêné par le bruit des humains, il décide de les anéantir par le déluge, mais Enki sauve Utnapishtim.',
'Enki (Ea)':'Dieu de l’eau douce et de la sagesse. Il prévient Utnapishtim du déluge en parlant au mur de sa maison de roseaux, et lui ordonne de construire un bateau.',
'Shamash':'Dieu soleil qui voit tout depuis le ciel, garant de la justice. Il est représenté sur la stèle du code d’Hammurabi, tendant les insignes de la loi au roi.',
'Sîn':'Dieu de la Lune, père de Shamash et d’Inanna. Il éclaire la nuit sur sa barque, et le calendrier mésopotamien suit ses phases.',
'Ereshkigal':'Reine des enfers (Irkalla), sœur d’Inanna. Quand Inanna descend chez elle, elle la fait mourir ; elle ordonne ensuite à Inanna de désigner un remplaçant. Son époux est Nergal.',
'Brahma':'Dieu créateur à quatre visages, né d’un lotus sorti du nombril de Vishnu. Peu vénéré aujourd’hui, il reste le dieu qui donne forme au monde à chaque cycle.',
'Lakshmi':'Déesse de la richesse et de la chance. Elle émerge de l’océan de lait quand les dieux et les démons le baratent, et choisit Vishnu pour époux.',
'Saraswati':'Déesse du savoir, de la musique et des arts, elle joue de la vina. Les étudiants l’honorent à la fête de Vasant Panchami, au printemps.',
'Durga et Kali':'Les dieux créent Durga pour vaincre le démon-buffle Mahishasura, et elle y parvient après neuf nuits. Dans un autre combat, Kali jaillit de son front pour boire le sang du démon Raktabija, dont chaque goutte donnait un double.',
'Indra':'Roi des dieux et maître de l’orage, il brandit la foudre vajra. Il tue le dragon Vritra qui retenait les eaux et libère les rivières.',
'Fuxi':'Frère et époux de Nüwa dans certains récits, il enseigne la pêche, l’élevage et les huit trigrammes, base du Yi Jing. On le représente souvent avec une queue de serpent.',
'Empereur de Jade':'Souverain du Ciel et chef d’une administration céleste. Il organise la course des animaux : le rat monte sur le dos du bœuf, saute devant lui à l’arrivée et gagne la première place du zodiaque.',
'Xiwangmu':'Reine Mère de l’Ouest, qui règne sur le mont Kunlun. Dans son verger poussent les pêches d’immortalité, qui mûrissent tous les trois mille ans.',
'Guan Yu':'Général du Roman des Trois Royaumes, frère juré de Liu Bei et de Zhang Fei, célèbre pour sa loyauté. Exécuté en 220, il est divinisé comme dieu de la loyauté, de la guerre et des affaires.',
'Tsukuyomi':'Dieu de la Lune, frère d’Amaterasu. Il tue la déesse de la nourriture Ukemochi, dégoûté par la façon dont elle prépare un repas ; Amaterasu refuse de le revoir, d’où la séparation du jour et de la nuit.',
'Inari':'Kami du riz, de la prospérité et du commerce. Ses messagers sont les renards ; le sanctuaire de Fushimi Inari, à Kyoto, aligne des milliers de portiques rouges.',
'Raijin':'Kami du tonnerre, entouré de tambours qu’il frappe pour faire gronder l’orage. On le montre souvent avec Fujin dans les temples.',
'Fujin':'Kami du vent. Il porte un grand sac qu’il ouvre pour libérer les tempêtes. Selon la tradition, il aurait aidé à repousser les flottes mongoles avec le « vent divin » (kamikaze).',
'Ebisu':'Seul des Sept Dieux de la chance d’origine japonaise, protecteur des pêcheurs et des marchands. Il porte une canne à pêche et une daurade ; selon un récit, né sans os, il fut jeté à la mer puis recueilli.',
'Tengri':'Ciel éternel et dieu suprême des peuples turco-mongols. Il accorde ou retire au khan le mandat de gouverner, selon la justice de son règne.',
'Umay':'Déesse mère qui protège les enfants et les naissances. Les Turcs anciens l’invoquent pour la fertilité et la santé des nouveau-nés.',
'Erlik':'Maître des enfers dans les récits de l’Altaï. Surgi des eaux primordiales comme rival d’Ülgen, il apprend aux humains le mal et règne sur les morts.',
'Tlaloc':'Dieu de la pluie, de l’eau et des montagnes, il envoie aussi la grêle et la sécheresse. Il accueille au Tlalocan, paradis verdoyant, ceux morts noyés ou foudroyés.',
'Coatlicue':'Déesse à la jupe de serpents, mère de la Lune, des étoiles et de Huitzilopochtli. Elle devient enceinte en recueillant une boule de plumes tombée du ciel, au grand scandale de ses enfants.',
'Mictlantecuhtli':'Seigneur du Mictlan, séjour des morts. Pour y parvenir, l’âme traverse neuf niveaux en quatre ans, aidée d’un chien, avant de trouver le repos.',
'Itzamná':'Dieu créateur, représenté en vieil homme édenté. Il enseigne aux Mayas l’écriture, le calendrier et la médecine, et règne sur la connaissance.',
'Chaac':'Dieu maya de la pluie, une hache à la main : il frappe les nuages pour faire tomber l’eau. Les paysans le prient pour les récoltes de maïs.',
'Ixchel':'Déesse de la Lune, du tissage, de la naissance et de la guérison. Des pèlerins se rendaient à Cozumel pour implorer sa protection. Elle déverse aussi les eaux d’un déluge dans certains récits.',
'Pachamama':'Terre-mère des Andes. Avant de semer ou de bâtir, on lui verse de la chicha et on lui offre des feuilles de coca ; la tradition perdure encore aujourd’hui.',
'Mama Quilla':'Déesse de la Lune, épouse d’Inti, protectrice des femmes et du calendrier. Lors d’une éclipse, les Incas faisaient du bruit pour éloigner l’animal qui l’attaquait.',
'Illapa':'Dieu de la foudre et de la pluie. Dans le ciel, il porte une jarre dont l’eau tombe en pluie, et sa fronde envoie les éclairs.',
'Oiseau-Tonnerre':'Immense oiseau dont les battements d’ailes causent le tonnerre et dont les yeux lancent des éclairs. Il affronte les serpents d’eau, créatures du monde souterrain, dans de grands combats.',
'Femme Bison blanc (Lakota)':'Une femme surnaturelle apparaît à deux chasseurs lakotas, leur offre la pipe sacrée et enseigne les sept rites. Elle s’éloigne en roulant et se transforme en bison blanc.',
'Nanabozho (Anishinaabe)':'Héros farceur. Après un déluge, il envoie des animaux plonger chercher de la terre ; le rat musqué en rapporte une poignée, avec laquelle Nanabozho recrée la terre sur le dos d’une tortue.',
'Sila':'Esprit de l’air, du temps et de l’ordre du monde. Il est à la fois souffle de vie et force des tempêtes, que seul le chaman peut approcher.',
'Tarqeq':'Dieu de la Lune, qui veille sur les chasseurs et sur la fertilité. Les Inuits l’invoquent pour une bonne chasse.',
'Malina':'Déesse du Soleil. Son frère Anningan, la Lune, la poursuit sans fin après une querelle ; leur course explique les éclipses, quand il la rattrape un instant.',
'Veles':'Dieu des eaux, du bétail et du monde souterrain, adversaire de Perun. Il vole son bétail et se cache sous les arbres ou dans l’eau ; Perun le frappe de sa foudre, et l’orage ramène la pluie.',
'Mokosh':'Déesse de la terre, de la fertilité et des travaux féminins, notamment le filage. On lui offre des fils et de la laine, et elle protège les femmes.',
'Dazhbog':'Dieu du soleil et donneur de richesse. Les Slaves le voient traverser le ciel sur un char ; il est ancêtre mythique de certains peuples.',
'Angra Mainyu':'Esprit de destruction, il s’oppose à Ahura Mazda en créant la mort, la maladie et le mensonge. Selon le zoroastrisme, il sera vaincu à la fin des temps.',
'Mithra':'Dieu de l’alliance, de la lumière et des serments, garant des contrats. Il surveille chaque parole donnée et sera plus tard au cœur du culte romain de Mithra.',
'Anahita':'Déesse des eaux et de la fertilité, représentée en jeune femme resplendissante. Les rois perses l’invoquaient pour la victoire et la prospérité.',
'Allat':'Déesse de l’Arabie préislamique, vénérée notamment à Taïf. Elle est souvent associée à la fertilité et à la protection.',
'Al-Uzza':'Déesse de la puissance, associée à l’étoile du matin, honorée à Nakhla par les Quraychites avant l’islam.',
'Manat':'Déesse du destin et du temps, honorée près de Qudayd. Ses sanctuaires attiraient des pèlerins avant l’islam.',
'Hubal':'Dieu dont la statue se trouvait à la Kaaba avant l’islam. Les Mecquois tiraient des flèches devant lui pour consulter le destin.',
'Olodumare':'Dieu suprême yoruba, créateur lointain. Il envoie les orishas sur terre et confie à Obatala la création des humains ; Orunmila est son témoin et son conseiller.',
'Yemoja':'Mère des eaux et de nombreux orishas, protectrice des enfants et des femmes. Elle est liée à la mer et aux rivières, et son culte a traversé l’Atlantique jusqu’au Brésil.',
'Ogun':'Orisha du fer et de la forge. Avec son coutelas, il ouvre le chemin dans la forêt pour que les autres orishas descendent sur terre ; il protège forgerons, chasseurs et soldats.',
'Oshun':'Orisha de la rivière, de l’amour et de la fertilité. Quand les autres orishas l’excluent, le monde s’assèche ; ils reconnaissent leur erreur, et elle ramène la pluie.',
'Nyame':'Dieu du ciel akan, créateur de toutes choses. Anansi lui achète ses histoires en accomplissant des tâches impossibles : c’est ainsi que les contes viennent aux hommes.',
'Unkulunkulu':'Premier ancêtre et créateur des Zoulous. Il surgit d’un lit de roseaux, fait naître les peuples, les animaux et enseigne le feu et l’agriculture.',
'Baiame':'Dieu créateur du sud-est de l’Australie, descendu du ciel, il donne la loi et les cérémonies aux hommes. La Voie lactée est son fleuve.',
'Tāne':'Fils de Ranginui et Papatūānuku. Il sépare le ciel et la terre en poussant avec ses jambes pour faire entrer la lumière, plante les forêts et façonne la première femme.',
'Tangaroa':'Dieu de l’océan et des poissons. Quand Tāwhirimātea, dieu des tempêtes, attaque ses frères, les créatures de Tangaroa fuient dans la mer, et les reptiles se réfugient dans la forêt.',
'Hine-nui-te-pō':'Fille de Tāne, Hine-tītama fuit aux enfers en apprenant qu’elle avait épousé son propre père. Devenue déesse de la nuit et de la mort, elle accueille tous les humains.',
'Lemminkäinen':'Héros joyeux et téméraire. Il va chasser le cygne de Tuonela, est tué, découpé, et sa mère repêche chaque morceau dans le fleuve avant de le ramener à la vie.',
'Louhi':'Maîtresse de Pohjola, le Nord sombre. Elle cache le soleil et la lune, prive le pays de lumière, puis se transforme en aigle pour reprendre le Sampo ; il est brisé en mer.',
'Ukko':'Dieu du ciel et du tonnerre, invoqué pour la pluie et les récoltes. Les Finnois prient « Ukko, vieux père des cieux » en cas de sécheresse.'

['Étrusque','Europe','Antiquité, Toscane (VIIIe–Ier s. av. J.-C.)','Selon la tradition, un paysan de Tarquinia laboure un champ quand un enfant à la sagesse de vieillard surgit d’un sillon : c’est Tagès, qui dicte aux Étrusques les règles de la divination.',['Tinia : ciel et foudre','Uni : reine des dieux','Menrva : sagesse et guerre','Turan : amour','Charun : passeur des morts','Tagès : enfant-prophète'],['Charun','Vanth (ailée, guide des âmes)','Tuchulcha (démon à bec de vautour)','Lasa (nymphes ailées)'],'Tagès et les livres rituels : l’art d’interpréter la foudre et les entrailles, transmis aux haruspices.','Rome a hérité des haruspices, des faisceaux de licteurs et d’une partie de sa religion.','🔮'],
['Coréenne','Asie','Péninsule coréenne, récits des Trois Royaumes','Hwanung, fils du Seigneur du ciel, descend sur le mont Taebaek. Un ours et un tigre le prient de les rendre humains ; seul l’ours résiste cent jours dans une grotte et devient une femme, mère de Dangun.',['Hwanung : fils du ciel','Dangun : fondateur de la nation','Jumong : fondateur de Goguryeo','Samshin Halmoni : déesse de la naissance','Yongwang : roi dragon des mers'],['Gumiho (renard à neuf queues)','Dokkaebi (esprits farceurs)','Haetae (gardien à corps de lion)','Jeoseung Saja (messagers de la mort)'],'Dangun fonde Gojoseon, premier royaume coréen selon la légende ; Jumong naît d’un œuf et devient archer et roi.','Le 3 octobre, la fête de Gaecheonjeol célèbre la fondation ; le chamanisme musok perpétue ces dieux.','🐻'],
['Tibétaine','Asie','Haut plateau tibétain, bön puis bouddhisme','Chenrezig, bodhisattva de la compassion, prend la forme d’un singe qui épouse une ogresse des rochers. Leurs six enfants sont les premiers habitants du Tibet, ancêtres des Tibétains.',['Chenrezig : compassion','Tara : déesse libératrice','Padmasambhava : maître venu du lotus','Gesar : roi guerrier','Palden Lhamo : protectrice'],['Yéti','Nâgas (esprits des eaux)','Dakinis (danseuses du ciel)','Tsen (esprits des montagnes)'],'L’épopée du roi Gesar de Ling, chantée par des conteurs, et le Livre des morts tibétain (Bardo Thödol).','Drapeaux et moulins à prières ; le dalaï-lama est vu comme une émanation de Chenrezig.','🏔️']
);
Object.assign(S,{
'Tinia':'Maître de la foudre et chef des dieux étrusques, assimilé à Jupiter. Chaque éclair est un message que les haruspices interprètent. Il forme avec Uni et Menrva la grande triade honorée dans les temples.',
'Uni':'Épouse de Tinia et reine des dieux, assimilée à Junon. À Pyrgi, port de Caeré, des lamelles d’or écrites en étrusque et en phénicien l’associent à la déesse Astarté.',
'Menrva':'Déesse de la sagesse et de la guerre, équivalent de Minerve. Elle figure sur des miroirs de bronze, casquée, aux côtés de héros comme Hercle (Héraclès).',
'Charun':'Démon des enfers au nez crochu, aux oreilles pointues et à la peau bleutée, armé d’un grand maillet. Les fresques des tombes le montrent attendant les défunts : un passeur redouté vers l’au-delà.',
'Tagès':'Enfant au visage de vieillard sorti d’un sillon près de Tarquinia. Il dicte aux peuples d’Étrurie l’art de lire les entrailles et la foudre, puis meurt le jour même ; ses paroles, notées, forment la discipline étrusque.',
'Hwanung':'Fils de Hwanin, Seigneur du ciel, il désire vivre parmi les humains. Son père lui donne trois talismans et il descend sur le mont Taebaek avec les ministres du vent, de la pluie et des nuages. Il y fonde une cité et enseigne lois et agriculture.',
'Dangun':'Fils de Hwanung et d’une ourse devenue femme après cent jours dans une grotte, à manger de l’ail et de l’armoise. Il fonde Gojoseon en 2333 av. J.-C. selon la tradition et devient à la fin dieu de la montagne.',
'Jumong':'Né d’un œuf pondu par Yuhwa, fille du dieu du fleuve, fécondée par un rayon de soleil. Excellent archer, menacé par les princes de Buyeo, il fuit vers le sud, franchit un fleuve sur un pont de poissons et de tortues et fonde Goguryeo.',
'Samshin Halmoni':'Déesse de la naissance et de la grossesse. Après un accouchement, on lui offre du riz et de la soupe d’algues, et une corde de paille accrochée à la porte annonce la naissance du bébé.',
'Yongwang':'Roi dragon des mers, qui règne dans un palais sous l’eau. Pêcheurs et marins l’honorent par des rites pour obtenir une mer calme et de bonnes prises.',
