<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Transport Scolaire</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b2d;--card:#18283f;--line:#2a3f5f;--txt:#eef3fb;--mut:#93a5c0;--yel:#ffc928;--yelt:#1a1400;--go:#35d0a4;--back:#ff8a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6fb;--card:#fff;--line:#d5deeb;--txt:#14233a;--mut:#5d6f89;--go:#0c9a74;--back:#d9541c}}
:root[data-theme="light"]{--bg:#f3f6fb;--card:#fff;--line:#d5deeb;--txt:#14233a;--mut:#5d6f89;--go:#0c9a74;--back:#d9541c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:1.7rem;font-weight:800;margin:0;letter-spacing:-.02em}
h1 span{display:inline-block;background:var(--yel);color:var(--yelt);padding:0 10px;border-radius:8px;transform:rotate(-2deg)}
.sub{color:var(--mut);margin:2px 0 0;font-size:.9rem}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:1.1rem}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.day{flex:1 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--mut);position:relative}
.day.on{background:var(--yel);color:var(--yelt);border-color:var(--yel)}
.day i{position:absolute;top:-6px;right:-4px;background:var(--back);color:#fff;border-radius:99px;font-size:.7rem;font-style:normal;padding:1px 6px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--txt);font:inherit;margin-bottom:18px}
.group{margin-bottom:22px}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gh h2{margin:0;font-size:1.15rem}
.gh small{color:var(--mut)}
.dot{width:14px;height:14px;border-radius:50%}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.time{font-weight:800;font-size:1.25rem;min-width:66px;color:var(--c)}
.nm{flex:1;font-weight:600;word-break:break-word}
button.ok{width:42px;height:42px;border-radius:50%;border:2px solid var(--c);background:none;font-size:1.1rem;color:var(--c);flex:none}
.row.done .time,.row.done .nmt{opacity:.55}
.row.done .nmt{text-decoration:line-through}
.cls{display:inline-block;margin-left:8px;font-size:.7rem;font-weight:800;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut);vertical-align:middle}
.pay-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-weight:500}
.paybox{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.85rem;cursor:pointer}
.paybox input{accent-color:var(--go);width:18px;height:18px;margin:0}
.pst{font-size:.8rem;color:var(--mut)}
.pst.ok{color:var(--go);font-weight:700}
.pst.end,.pst.warn{color:var(--back);font-weight:800}
.hint{grid-column:1/-1;margin:0;color:var(--mut);font-size:.85rem;min-height:1.1em}
.row.done button.ok{background:var(--c);color:#fff}
.tel{display:inline-block;margin-top:3px;font-weight:500;font-size:.85rem;color:var(--mut);text-decoration:none}
.tel:hover{color:var(--yel)}
.lnk{background:none;border:1px solid var(--line);border-radius:99px;color:var(--mut);padding:6px 14px;margin-bottom:14px;font-size:.85rem}
.del{background:none;color:var(--mut);font-size:1.1rem;padding:6px 10px;border-radius:8px}
.edt{background:none;color:var(--mut);font-size:1.1rem;padding:6px 10px;border-radius:8px}
.edt:hover{color:var(--yel)}
.cancel{grid-column:1/-1;background:none;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--mut)}
.del:hover{color:var(--back)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:-2px 0 10px}
.bar b{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .3s}
.row.next{box-shadow:0 0 0 2px var(--c)}
.nx{background:var(--c);color:#fff;font-size:.65rem;font-weight:800;border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:middle;text-transform:uppercase}
.sms{display:inline-block;margin:3px 0 0 12px;font-size:.85rem;color:var(--mut);text-decoration:none}
.sms:hover{color:var(--yel)}
.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--txt);font:inherit;font-size:.85rem;resize:vertical}
.f input#smsmsg{width:100%}
.ok-msg{color:var(--go);font-size:.85rem;min-height:1.1em;grid-column:1/-1;margin:0}
.empty{color:var(--mut);padding:12px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.add{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px}
.add h2{margin:0 0 12px;font-size:1.1rem}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mut)}
.f .full{grid-column:1/-1}
.f select,.f input[type=text],.f input[type=time],.f input[type=number],.f input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--txt);font:inherit;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 12px;cursor:pointer;color:var(--txt)}
.chips input{accent-color:var(--yel)}
.save{grid-column:1/-1;background:var(--yel);color:var(--yelt);font-weight:800;border-radius:12px;padding:14px;font-size:1.05rem}
.err{color:var(--back);font-size:.85rem;min-height:1.1em;grid-column:1/-1;margin:0}
.absb{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.85rem;color:var(--mut)}
.absb:hover{color:var(--back);border-color:var(--back)}
.rest{background:none;border:1px solid var(--go);border-radius:99px;color:var(--go);padding:6px 14px;font-size:.85rem;flex:none}
.row.abs .nmt{opacity:.8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#14233a;color:#fff;border-radius:99px;padding:10px 16px;display:flex;gap:14px;align-items:center;z-index:20;max-width:92vw;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast[hidden]{display:none}
.toast button{background:none;color:#ffc928;font-weight:800}
.offdel{background:none;color:var(--mut);font-size:1.1rem;padding:6px 10px;border-radius:8px}
.offdel:hover{color:var(--back)}
summary{cursor:pointer;font-weight:800;font-size:1.1rem}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav .lnk{margin:0;font-size:1.1rem;padding:6px 18px}
.sum{margin:0 0 10px}
.sh{margin:16px 0 6px;font-size:.95rem;color:var(--mut)}
.rrow{padding:8px 0;border-bottom:1px solid var(--line)}
.rrow .sms{margin-left:8px}
@media (max-width:420px){.f{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">
  <header>
    <div><h1><span>Bus</span> des élèves</h1><p class="sub" id="sub"></p></div>
    <button class="ghost" id="theme" aria-label="Changer de thème">◐</button>
  </header>
  <div class="days" id="days"></div>
  <input class="search" id="q" type="search" placeholder="Chercher un nom, une heure ou un numéro">
  <button class="lnk" id="reset">Réinitialiser la journée (faits et absents)</button>
  <section class="group">
    <div class="gh"><span class="dot" style="background:var(--go)"></span><h2>Aller · à chercher chez eux</h2><small id="n1"></small></div>
    <div class="bar" style="--c:var(--go)"><b id="b1"></b></div>
    <div id="l1"></div>
  </section>
  <section class="group">
    <div class="gh"><span class="dot" style="background:var(--back)"></span><h2>Retour · à ramener chez eux</h2><small id="n2"></small></div>
    <div class="bar" style="--c:var(--back)"><b id="b2"></b></div>
    <div id="l2"></div>
  </section>
  <section class="group" id="g3" hidden>
    <div class="gh"><span class="dot" style="background:var(--mut)"></span><h2>Absents ce jour · non comptés</h2><small id="n3"></small></div>
    <div id="l3"></div>
  </section>
  <form class="add" id="form" autocomplete="off">
    <h2 id="ftitle">Ajouter un élève</h2>
    <div class="f">
      <label class="full">Nom de l'élève<input type="text" id="name" placeholder="Prénom Nom"></label>
      <label class="full">Téléphone (facultatif)<input type="text" id="tel" inputmode="tel" placeholder="0555 12 34 56"></label>
      <label class="full">Adresse ou lien Google Maps (facultatif)<input type="text" id="addr" placeholder="Quartier, rue… ou lien Maps"></label>
      <button class="cancel" id="geo" type="button">📍 Utiliser ma position actuelle</button>
      <label class="full">Classe de l'élève<select id="cls"></select></label>
      <p class="hint" id="hint"></p>
      <label class="full">Allers-retours déjà effectués (avant l'appli)<input type="number" id="nb" min="0" step="1" inputmode="numeric" value="0"></label>
      <label>Heure d'aller<input type="time" id="t1" value="07:30"></label>
      <label>Heure de retour<input type="time" id="t2" value="16:00"></label>
      <label class="full">Jours<div class="chips" id="chips"></div></label>
      <p class="err" id="err"></p>
      <button class="save" id="savebtn" type="submit">Ajouter à la liste</button>
      <button class="cancel" id="cancel" type="button" hidden>Annuler la modification</button>
    </div>
  </form>
  <section class="add" style="margin-top:18px">
    <h2>📅 Absences prévues</h2>
    <div class="f">
      <label class="full">Élève<select id="offs"></select></label>
      <label>Du<input type="date" id="offd1"></label>
      <label>Au (facultatif)<input type="date" id="offd2"></label>
      <p class="err" id="offerr"></p>
      <button class="save" id="offadd" type="button">Ajouter l'absence</button>
      <div class="full" id="offl"></div>
    </div>
  </section>
  <details class="add" id="rep" style="margin-top:18px">
    <summary>📊 Historique et encaissements</summary>
    <div id="repc" style="margin-top:12px"></div>
  </details>
  <section class="add" style="margin-top:18px">
    <h2>Options</h2>
    <div class="f">
      <label class="full">Message SMS « Je suis là » (utilisez {nom} pour le nom de l'élève)<input type="text" id="smsmsg"></label>
      <label class="full">Message de renouvellement de paiement ({nom}, {montant}, {max})<input type="text" id="renmsg"></label>
      <button class="cancel" id="wa" type="button">📤 Partager la liste du jour sur WhatsApp</button>
      <button class="cancel" id="exp" type="button">💾 Copier la sauvegarde de la liste</button>
      <label class="full">Zone de sauvegarde (collez ici pour restaurer)<textarea id="bk" rows="3"></textarea></label>
      <button class="cancel" id="imp" type="button">♻️ Restaurer depuis cette zone</button>
      <p class="ok-msg" id="bkm"></p>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden><span id="tmsg"></span><button id="tund" type="button">Annuler</button></div>
<script>
var D=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var ORDER=[0,1,2,3,4,5,6];
var CLS=[['P1','1ère année primaire','1ère AP'],['P2','2ème année primaire','2ème AP'],['P3','3ème année primaire','3ème AP'],['P4','4ème année primaire','4ème AP'],['P5','5ème année primaire','5ème AP'],['M1','1ère année moyenne','1ère AM'],['M2','2ème année moyenne','2ème AM'],['M3','3ème année moyenne','3ème AM'],['M4','4ème année moyenne','4ème AM']];
var PRICE={P:3000,M:1500},LIM={P:8,M:4};
function kind(s){return s.cls?s.cls.charAt(0):null}
function clsShort(c){var r=CLS.filter(function(x){return x[0]===c})[0];return r?r[2]:''}
function clsTag(s){return s.cls?'<span class="cls">'+esc(clsShort(s.cls))+'</span>':''}
function isoToday(){var n=new Date();return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate()}
function norm(s){s.cls=s.cls||'';s.paid=!!s.paid;s.trips=Array.isArray(s.trips)?s.trips:[];s.addr=s.addr||'';s.h=(s.h&&typeof s.h==='object'&&!Array.isArray(s.h))?s.h:{};s.pay=Array.isArray(s.pay)?s.pay:[];s.off=Array.isArray(s.off)?s.off:[];return s}
function iso(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dateOf(c){var n=new Date();n.setDate(n.getDate()+(c-n.getDay()+7)%7);return iso(n)}
function fmt(d){return d.slice(8)+'/'+d.slice(5,7)}
function byName(a,b){return a.name.localeCompare(b.name,'fr')}
function planned(s,dt){return s.off.some(function(o){return dt>=o[0]&&dt<=o[1]})}
function isAbs(s,c){if(c==null)c=cur;var v=absent[c+'-'+s.id];return v===1||(v!==2&&planned(s,dateOf(c)))}
function syncHist(){
  var t=new Date().getDay(),d=iso(),ch=false;
  students.forEach(function(s){
    if(s.days.indexOf(t)<0)return;
    var a=isAbs(s,t),v=s.h[d];
    if(a&&v!=='A'){s.h[d]='A';ch=true}
    else if(!a&&v==='A'){delete s.h[d];ch=true}
  });
  if(ch)save();
}
function isEnd(s){var k=kind(s);return !!k&&!s.paid&&s.trips.length>=LIM[k]}
function payHtml(s){
  var k=kind(s);
  if(!k)return '<span class="pay-line"><span class="pst warn">⚠ Choisir la classe (✎)</span></span>';
  var lim=LIM[k],n=s.trips.length,txt,cl;
  if(s.paid){txt='Payé '+PRICE[k]+' Da · '+n+'/'+lim+' allers-retours';cl='ok'}
  else if(isEnd(s)){txt='Paiement terminé · '+n+'/'+lim+' · à renouveler ('+PRICE[k]+' Da)';cl='end'}
  else{txt='Non payé · '+PRICE[k]+' Da'+(n?' ('+n+'/'+lim+' faits)':'');cl='no'}
  return '<span class="pay-line"><label class="paybox"><input type="checkbox" class="pay" data-id="'+s.id+'"'+(s.paid?' checked':'')+'> Payé</label><span class="pst '+cl+'">'+txt+'</span></span>';
}
function syncTrip(s){
  if(!s)return;
  var both=done[cur+'-'+s.id+'-t1']&&done[cur+'-'+s.id+'-t2'];
  if(cur===new Date().getDay()){var dy=iso();if(both)s.h[dy]='T';else if(s.h[dy]==='T')delete s.h[dy]}
  var k=kind(s);if(!k)return;
  var T=isoToday(),i=s.trips.indexOf(T),lim=LIM[k];
  if(both&&i<0&&s.paid){s.trips.push(T);if(s.trips.length>=lim)s.paid=false}
  else if(!both&&i>-1)uncount(s,T);
}
function uncount(s,T){
  var i=s.trips.indexOf(T||isoToday());if(i<0)return;
  var was=isEnd(s);s.trips.splice(i,1);if(was)s.paid=true;
}
function setTrips(s,n){
  var T=isoToday(),has=s.trips.indexOf(T)>-1,base=s.trips.filter(function(x){return x!==T}),t=Math.max(0,n-(has?1:0));
  while(base.length>t)base.shift();
  while(base.length<t)base.unshift('avant-appli');
  s.trips=has?base.concat([T]):base;
}
function findS(id){return students.filter(function(x){return String(x.id)===String(id)})[0]}
var students=[],cur=new Date().getDay();
try{var s=localStorage.getItem('eleves');if(s)students=JSON.parse(s)}catch(e){}
students.forEach(norm);
var smsmsg='Bonjour, le bus est arrivé chez {nom}.';
try{smsmsg=localStorage.getItem('smsmsg')||smsmsg}catch(e){}
var renmsg='Bonjour, le paiement du transport scolaire de {nom} est à renouveler : {montant} Da pour {max} allers-retours. Merci.';
try{renmsg=localStorage.getItem('renmsg')||renmsg}catch(e){}
var done={},absent={},showDone={},today=new Date().toDateString();
try{var dd=JSON.parse(localStorage.getItem('fait')||'{}');if(dd.d===today){done=dd.v||{};absent=dd.a||{}}}catch(e){}
function saveDone(){try{localStorage.setItem('fait',JSON.stringify({d:today,v:done,a:absent}))}catch(e){}}
var toastT=null,toastFn=null;
function hideToast(){$('toast').hidden=true;toastFn=null;clearTimeout(toastT)}
function toast(msg,fn){$('tmsg').textContent=msg;toastFn=fn;$('toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(hideToast,6000)}
function save(){try{localStorage.setItem('eleves',JSON.stringify(students))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
try{var th=localStorage.getItem('theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
$('tund').onclick=function(){var f=toastFn;hideToast();if(f)f()};
$('theme').onclick=function(){
  var r=document.documentElement,dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':!matchMedia('(prefers-color-scheme:light)').matches;
  var n=dark?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}
};
$('days').innerHTML=ORDER.map(function(d){return '<button class="day" data-d="'+d+'">'+D[d]+'<i></i></button>'}).join('');
$('chips').innerHTML=ORDER.map(function(d){return '<label><input type="checkbox" value="'+d+'"'+(d>=1&&d<=4||d===0?' checked':'')+'>'+D[d].slice(0,3)+'.</label>'}).join('');
$('cls').innerHTML='<option value="">— Choisir la classe —</option><optgroup label="Primaire · 3000 Da / 8 allers-retours">'+CLS.slice(0,5).map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>'}).join('')+'</optgroup><optgroup label="Moyen · 1500 Da / 4 allers-retours">'+CLS.slice(5).map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>'}).join('')+'</optgroup>';
function updHint(){var c=$('cls').value;$('hint').textContent=c?'Tarif : '+PRICE[c.charAt(0)]+' Da pour '+LIM[c.charAt(0)]+' allers-retours (paiement terminé ensuite). Allers-retours déjà faits : de 0 à '+LIM[c.charAt(0)]+'.':''}
$('cls').onchange=updHint;updHint();
$('days').onclick=function(e){var b=e.target.closest('.day');if(b){cur=+b.dataset.d;render()}};
$('q').oninput=render;
function match(st,q,t){
  if(!q)return true;
  q=q.toLowerCase().trim();
  var h=t.replace(':','h');
  return st.name.toLowerCase().indexOf(q)>-1||clsShort(st.cls).toLowerCase().indexOf(q)>-1||(st.tel||'').replace(/\s/g,'').indexOf(q.replace(/\s/g,''))>-1||t.indexOf(q)>-1||h.indexOf(q.replace(':','h'))>-1;
}
function mapLink(s){
  if(!s.addr)return '';
  var a=s.addr.trim(),u=/^https?:\/\//i.test(a)?a:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);
  return ' <a class="sms" target="_blank" rel="noopener" href="'+esc(u)+'">📍 Itinéraire</a>';
}
function waNum(t){var d=t.replace(/[^\d+]/g,'');if(d.charAt(0)==='+')return d.slice(1);if(d.charAt(0)==='0')return '213'+d.slice(1);return d}
function renMsg(s){var k=kind(s);return renmsg.replace(/\{nom\}/g,s.name).replace(/\{montant\}/g,PRICE[k]).replace(/\{max\}/g,LIM[k])}
function remBtns(s){
  if(!kind(s))return '';
  var m=encodeURIComponent(renMsg(s)),t=s.tel?s.tel.replace(/[^\d+]/g,''):'';
  return (t?'<a class="sms" href="sms:'+esc(t)+'?body='+m+'">💬 SMS</a> ':'')+'<a class="sms" target="_blank" rel="noopener" href="https://wa.me/'+(t?esc(waNum(s.tel)):'')+'?text='+m+'">🟢 WhatsApp</a>';
}
function rowHtml(s,key,nxt){
  var k=cur+'-'+s.id+'-'+key,dn=!!done[k];
  var tel=s.tel?'<a class="tel" href="tel:'+esc(s.tel.replace(/[^\d+]/g,''))+'">📞 '+esc(s.tel)+'</a> <a class="sms" href="sms:'+esc(s.tel.replace(/[^\d+]/g,''))+'?body='+encodeURIComponent(smsmsg.replace(/\{nom\}/g,s.name))+'">💬 Je suis là</a>':'';
  var ml=mapLink(s),contact=(tel||ml)?'<br>'+tel+ml:'';
  var rem=isEnd(s)?'<span class="pay-line">'+remBtns(s)+'</span>':'';
  var ab=dn?'':'<span class="pay-line"><button class="absb" type="button" data-id="'+s.id+'">🚫 Absent aujourd\'hui</button></span>';
  return '<div class="row'+(dn?' done':'')+(nxt===s?' next':'')+'" style="--c:var(--'+(key==='t1'?'go':'back')+')"><button class="ok" data-k="'+k+'" data-id="'+s.id+'" aria-label="Marquer fait" aria-pressed="'+dn+'">'+(dn?'✓':'')+'</button><span class="time">'+s[key]+'</span><span class="nm"><span class="nmt">'+esc(s.name)+'</span>'+clsTag(s)+(nxt===s?'<span class="nx">Prochain</span>':'')+contact+payHtml(s)+rem+ab+'</span><button class="edt" data-id="'+s.id+'" aria-label="Modifier '+esc(s.name)+'">✎</button><button class="del" data-id="'+s.id+'" aria-label="Supprimer '+esc(s.name)+'">✕</button></div>';
}
function list(key,id,nid){
  var q=$('q').value;
  var onDay=students.filter(function(s){return s.days.indexOf(cur)>-1});
  var nAbs=onDay.filter(function(s){return isAbs(s)}).length;
  var all=onDay.filter(function(s){return !isAbs(s)&&match(s,q,s[key])}).sort(function(a,b){return a[key]<b[key]?-1:a[key]>b[key]?1:0});
  function isD(s){return !!done[cur+'-'+s.id+'-'+key]}
  var fin=all.filter(isD),pend=all.filter(function(s){return !isD(s)});
  var nd=fin.length,full=all.length&&nd===all.length;
  $(nid).textContent=nd+'/'+all.length+' fait'+(nd>1?'s':'')+(full?' 🎉':'');
  $('b'+nid.slice(1)).style.width=all.length?Math.round(nd/all.length*100)+'%':'0%';
  var nxt=cur===new Date().getDay()?pend[0]:null;
  var h=pend.map(function(s){return rowHtml(s,key,nxt)}).join('');
  if(!pend.length)h='<div class="empty">'+(all.length?'Tout est fait 🎉':q?'Aucun résultat pour cette recherche.':nAbs?'Tous les élèves du jour sont absents.':'Personne ce jour-là. Ajoutez un élève plus bas.')+'</div>';
  if(fin.length){
    h+='<button class="lnk" style="margin:6px 0 10px" data-sd="'+key+'">'+(showDone[key]?'Masquer':'Voir')+' les '+fin.length+' fait'+(fin.length>1?'s':'')+'</button>';
    if(showDone[key])h+=fin.map(function(s){return rowHtml(s,key,null)}).join('');
  }
  $(id).innerHTML=h;
}
function render(){
  syncHist();
  document.querySelectorAll('.day').forEach(function(b){
    var d=+b.dataset.d;b.classList.toggle('on',d===cur);
    b.querySelector('i').textContent=students.filter(function(s){return s.days.indexOf(d)>-1}).length;
  });
  $('sub').textContent=D[cur]+' · '+students.filter(function(s){return s.days.indexOf(cur)>-1}).length+' élève(s) au programme';
  var rn=students.filter(function(s){return s.days.indexOf(cur)>-1&&isEnd(s)}).length;
  if(rn)$('sub').textContent+=' · '+rn+' paiement(s) à renouveler';
  var ab=students.filter(function(s){return s.days.indexOf(cur)>-1&&isAbs(s)});
  if(ab.length)$('sub').textContent+=' · '+ab.length+' absent'+(ab.length>1?'s':'');
  $('g3').hidden=!ab.length;
  $('n3').textContent=ab.length+' élève'+(ab.length>1?'s':'');
  $('l3').innerHTML=ab.map(function(s){var man=absent[cur+'-'+s.id]===1;return '<div class="row abs" style="--c:var(--mut)"><span class="nm"><span class="nmt">'+esc(s.name)+'</span>'+clsTag(s)+(man?'':'<span class="cls">📅 prévu</span>')+'</span><button class="rest" type="button" data-id="'+s.id+'">↩ Rétablir</button></div>'}).join('');
  list('t1','l1','n1');list('t2','l2','n2');
  renderOff();renderReport();
}
$('reset').onclick=function(){done={};absent={};hideToast();saveDone();students.forEach(function(s){uncount(s);delete s.h[iso()]});save();render()};
document.addEventListener('click',function(e){
  var o=e.target.closest('button.ok');
  if(o){
    var k=o.dataset.k,s0=findS(o.dataset.id),was=!!done[k];
    if(was)delete done[k];else done[k]=1;
    saveDone();if(s0)syncTrip(s0);save();render();
    if(!was&&s0)toast(s0.name+' retiré de la liste',function(){delete done[k];saveDone();syncTrip(s0);save();render()});
    return
  }
  var ab=e.target.closest('.absb');
  if(ab){
    var sa=findS(ab.dataset.id);if(!sa)return;
    var ka=cur+'-'+sa.id,had=done[ka+'-t1']&&done[ka+'-t2'],prev=absent[ka];
    delete done[ka+'-t1'];delete done[ka+'-t2'];absent[ka]=1;
    if(had)uncount(sa);
    saveDone();save();render();
    toast(sa.name+' absent · non compté',function(){if(prev===undefined)delete absent[ka];else absent[ka]=prev;saveDone();render()});
    return
  }
  var rs=e.target.closest('.rest');
  if(rs){var kr=cur+'-'+rs.dataset.id;if(absent[kr]===1)delete absent[kr];else absent[kr]=2;saveDone();hideToast();render();return}
  var sd=e.target.closest('[data-sd]');
  if(sd){showDone[sd.dataset.sd]=!showDone[sd.dataset.sd];render();return}
  var od=e.target.closest('.offdel');
  if(od){var so=findS(od.dataset.id);if(so){so.off.splice(+od.dataset.i,1);save();render()}return}
  var mn=e.target.closest('[data-mn]');
  if(mn){rm.m+=+mn.dataset.mn;if(rm.m<0){rm.m=11;rm.y--}if(rm.m>11){rm.m=0;rm.y++}renderReport();return}
  var ra=e.target.closest('[data-act="repwa"]');
  if(ra){window.open('https://wa.me/?text='+encodeURIComponent(repText()),'_blank');return}
  var ed=e.target.closest('.edt');
  if(ed){var st=students.filter(function(x){return String(x.id)===ed.dataset.id})[0];if(st)startEdit(st);return}
  var b=e.target.closest('.del');if(!b)return;
  var s=students.filter(function(x){return String(x.id)===b.dataset.id})[0];
  if(!s)return;
  if(confirm('Supprimer '+s.name+' de la liste (tous les jours) ?')){
    students=students.filter(function(x){return x!==s});save();render();
  }
});
document.addEventListener('change',function(e){
  var p=e.target.closest&&e.target.closest('.pay');if(!p)return;
  var s=findS(p.dataset.id);if(!s)return;
  if(p.checked){s.paid=true;if(isEnd(s)||!s.trips.length)s.trips=[];else if(s.trips.length>=LIM[kind(s)])s.trips=[]}
  else s.paid=false;
  if(p.checked)s.pay.push({d:iso(),a:PRICE[kind(s)]});else s.pay.pop();
  if(s.paid&&s.trips.length>=LIM[kind(s)])s.trips=[];
  save();render();
});
var editId=null;
function startEdit(st){
  editId=st.id;
  $('name').value=st.name;$('tel').value=st.tel||'';$('t1').value=st.t1;$('t2').value=st.t2;$('cls').value=st.cls||'';$('nb').value=st.trips.length;$('addr').value=st.addr||'';updHint();
  document.querySelectorAll('#chips input').forEach(function(c){c.checked=st.days.indexOf(+c.value)>-1});
  $('ftitle').textContent='Modifier '+st.name;$('savebtn').textContent='Enregistrer les changements';$('cancel').hidden=false;$('err').textContent='';
  $('form').scrollIntoView({behavior:'smooth',block:'center'});$('name').focus();
}
function endEdit(){
  editId=null;$('form').reset();$('ftitle').textContent='Ajouter un élève';$('savebtn').textContent='Ajouter à la liste';$('cancel').hidden=true;updHint();
}
$('cancel').onclick=endEdit;
$('form').onsubmit=function(e){
  e.preventDefault();
  var name=$('name').value.trim(),t1=$('t1').value,t2=$('t2').value;
  var days=Array.prototype.map.call(document.querySelectorAll('#chips input:checked'),function(c){return +c.value});
  var cls=$('cls').value,nb=parseInt($('nb').value,10)||0;
  var err=!name?'Écrivez le nom de l\'élève.':!cls?'Choisissez la classe de l\'élève.':(cls&&(nb<0||nb>LIM[cls.charAt(0)]))?'Allers-retours déjà effectués : entre 0 et '+LIM[cls.charAt(0)]+'.':!days.length?'Choisissez au moins un jour.':(!t1||!t2)?'Indiquez les deux heures.':'';
  $('err').textContent=err;if(err)return;
  var tel=$('tel').value.trim(),addr=$('addr').value.trim();
  if(editId!==null){
    var st=students.filter(function(x){return x.id===editId})[0];
    if(st){st.name=name;st.tel=tel;st.addr=addr;st.t1=t1;st.t2=t2;st.days=days;st.cls=cls;setTrips(st,nb);if(st.paid&&st.trips.length>=LIM[kind(st)])st.paid=false}
    endEdit();
  }else{
    students.push({id:Date.now(),name:name,tel:tel,addr:addr,t1:t1,t2:t2,days:days,cls:cls,paid:false,trips:[],h:{},pay:[],off:[]});
    setTrips(students[students.length-1],nb);
    $('name').value='';$('tel').value='';$('addr').value='';$('nb').value=0;$('name').focus();
  }
  save();
  if(days.indexOf(cur)<0)cur=days[0];
  render();
};
$('renmsg').value=renmsg;
$('renmsg').oninput=function(){renmsg=this.value;try{localStorage.setItem('renmsg',renmsg)}catch(e){}render()};
$('smsmsg').value=smsmsg;
$('smsmsg').oninput=function(){smsmsg=this.value;try{localStorage.setItem('smsmsg',smsmsg)}catch(e){}render()};
function bm(t){$('bkm').textContent=t}
function line(s,k){return s[k]+' – '+s.name+(s.tel?' ('+s.tel+')':'')}
$('wa').onclick=function(){
  var L=students.filter(function(s){return s.days.indexOf(cur)>-1&&!isAbs(s)});
  if(!L.length){bm('Personne ce jour-là.');return}
  function srt(k){return L.slice().sort(function(a,b){return a[k]<b[k]?-1:a[k]>b[k]?1:0}).map(function(s){return line(s,k)}).join('\n')}
  var t='🚌 '+D[cur]+'\n\n🟢 Aller\n'+srt('t1')+'\n\n🟠 Retour\n'+srt('t2');
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
};
$('exp').onclick=function(){
  var j=JSON.stringify({students:students,sms:smsmsg,ren:renmsg});$('bk').value=j;
  function manual(){$('bk').select();bm('Sélectionnez le texte ci-dessus et copiez-le dans une note.')}
  try{navigator.clipboard.writeText(j).then(function(){bm('Copié ! Collez-le dans une note ou un message pour le garder.')},manual)}catch(e){manual()}
};
$('imp').onclick=function(){
  try{
    var o=JSON.parse($('bk').value);
    var l=o.students.filter(function(x){return x&&x.name&&Array.isArray(x.days)&&x.t1&&x.t2});
    if(!l.length)throw 0;
    if(!confirm('Remplacer la liste actuelle par la sauvegarde ('+l.length+' élèves) ?'))return;
    students=l.map(function(x,i){x.id=x.id||Date.now()+i;x.tel=x.tel||'';return norm(x)});
    if(o.sms){smsmsg=o.sms;$('smsmsg').value=smsmsg;try{localStorage.setItem('smsmsg',smsmsg)}catch(e){}}
    if(o.ren){renmsg=o.ren;$('renmsg').value=renmsg;try{localStorage.setItem('renmsg',renmsg)}catch(e){}}
    save();render();bm('Liste restaurée.');
  }catch(e){bm('Sauvegarde invalide : rien n\'a été changé.')}
};
var MN=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var rm={y:new Date().getFullYear(),m:new Date().getMonth()};
function repData(){
  var p=rm.y+'-'+('0'+(rm.m+1)).slice(-2),tot=0,np=0,rows=[];
  students.slice().sort(byName).forEach(function(s){
    var T=[],A=[],P=0;
    Object.keys(s.h).sort().forEach(function(d){if(d.indexOf(p)===0){var n=parseInt(d.slice(8),10);if(s.h[d]==='T')T.push(n);else if(s.h[d]==='A')A.push(n)}});
    s.pay.forEach(function(x){if(x&&typeof x.d==='string'&&x.d.indexOf(p)===0){P+=x.a;tot+=x.a;np++}});
    if(T.length||A.length||P)rows.push({s:s,T:T,A:A,P:P});
  });
  return {tot:tot,np:np,rows:rows};
}
function unpaidList(){return students.filter(function(s){return kind(s)&&!s.paid}).sort(byName)}
function repText(){
  var r=repData(),un=unpaidList();
  var t='📊 Transport · '+MN[rm.m]+' '+rm.y+'\n💰 Encaissé : '+r.tot+' Da ('+r.np+' paiement'+(r.np>1?'s':'')+')\n';
  r.rows.forEach(function(x){t+='\n'+x.s.name+' – '+x.T.length+' trajet'+(x.T.length>1?'s':'')+(x.T.length?' ('+x.T.join(', ')+')':'')+(x.A.length?' – '+x.A.length+' absence'+(x.A.length>1?'s':'')+' ('+x.A.join(', ')+')':'')});
  if(un.length)t+='\n\n⏳ À régler : '+un.map(function(s){return s.name}).join(', ');
  return t;
}
function renderReport(){
  var r=repData(),un=unpaidList(),due=0;
  un.forEach(function(s){due+=PRICE[kind(s)]});
  var h='<div class="mnav"><button class="lnk" type="button" data-mn="-1" aria-label="Mois précédent">‹</button><b>'+MN[rm.m]+' '+rm.y+'</b><button class="lnk" type="button" data-mn="1" aria-label="Mois suivant">›</button></div>';
  h+='<p class="sum">💰 Encaissé : <b>'+r.tot+' Da</b> · '+r.np+' paiement'+(r.np>1?'s':'')+'</p>';
  h+='<h3 class="sh">Trajets du mois</h3>';
  h+=r.rows.length?r.rows.map(function(x){return '<div class="rrow"><b>'+esc(x.s.name)+'</b>'+clsTag(x.s)+'<div class="pst">🚌 '+x.T.length+' trajet'+(x.T.length>1?'s':'')+(x.T.length?' (jours : '+x.T.join(', ')+')':'')+(x.A.length?' · 🚫 '+x.A.length+' absence'+(x.A.length>1?'s':'')+' ('+x.A.join(', ')+')':'')+(x.P?' · 💰 '+x.P+' Da':'')+'</div></div>'}).join(''):'<div class="empty">Rien d\'enregistré ce mois-ci.</div>';
  h+='<h3 class="sh">À régler · '+un.length+' élève'+(un.length>1?'s':'')+' ('+due+' Da)</h3>';
  h+=un.length?un.map(function(s){return '<div class="rrow"><b>'+esc(s.name)+'</b>'+clsTag(s)+'<div class="pst">'+(isEnd(s)?'Paiement terminé':'Non payé')+' · '+PRICE[kind(s)]+' Da'+remBtns(s)+'</div></div>'}).join(''):'<div class="empty">Tout le monde a payé 👍</div>';
  h+='<button class="cancel" type="button" data-act="repwa" style="margin-top:12px;width:100%">📤 Partager le rapport sur WhatsApp</button>';
  $('repc').innerHTML=h;
}
function renderOff(){
  var sel=$('offs'),v=sel.value;
  sel.innerHTML='<option value="">— Choisir un élève —</option>'+students.slice().sort(byName).map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('');
  sel.value=v;
  var T=iso(),L=[];
  students.forEach(function(s){s.off.forEach(function(o,i){if(o[1]>=T)L.push({s:s,o:o,i:i})})});
  L.sort(function(a,b){return a.o[0]<b.o[0]?-1:a.o[0]>b.o[0]?1:0});
  $('offl').innerHTML=L.length?L.map(function(x){return '<div class="row" style="--c:var(--mut)"><span class="nm"><span class="nmt">'+esc(x.s.name)+'</span><br><span class="pst">'+(x.o[0]===x.o[1]?'le '+fmt(x.o[0]):'du '+fmt(x.o[0])+' au '+fmt(x.o[1]))+'</span></span><button class="offdel" type="button" data-id="'+x.s.id+'" data-i="'+x.i+'" aria-label="Supprimer l\'absence">✕</button></div>'}).join(''):'<div class="empty">Aucune absence prévue.</div>';
}
$('offadd').onclick=function(){
  var st=findS($('offs').value),a=$('offd1').value,b=$('offd2').value||a;
  var er=!st?'Choisissez un élève.':!a?'Choisissez la date de début.':b<a?'La date de fin est avant le début.':'';
  $('offerr').textContent=er;if(er)return;
  st.off.push([a,b]);save();$('offd1').value='';$('offd2').value='';render();
};
$('geo').onclick=function(){
  if(!navigator.geolocation){$('err').textContent='Position non disponible sur cet appareil.';return}
  $('err').textContent='Recherche de la position…';
  navigator.geolocation.getCurrentPosition(function(p){$('addr').value=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);$('err').textContent=''},function(){$('err').textContent='Position indisponible : autorisez la localisation ou saisissez l\'adresse.'},{enableHighAccuracy:true,timeout:15000});
};
render();
</script>
</body>
