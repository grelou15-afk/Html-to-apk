@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e6efec;--mu:#9bb0a9;--ac:#38b8a4;--bd:#2c3a35;--ok:#5fd08a;--ko:#ff8a80}}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:12px;max-width:760px;margin:auto}
h1{font-size:20px;margin:6px 0 10px}nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button,.b{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on,.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;width:100%}
.r{display:flex;gap:6px;align-items:center;margin-bottom:6px}.r input[type=number]{width:80px}
.t{font-size:12px;color:var(--mu)}.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 8px;margin:2px 2px 0 0}
.ok{color:var(--ok)}.ko{color:var(--ko)}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}

/* 2. Versions */

/* 3. Journal pH */
window.jpA=()=>{const e={d:td(),l:$("jl").value,a:$("ja").value,m:+$("jm").value||0,b:+$("jb").value,f:+$("jf").value,w:+$("jw").value||0};if(!e.b||!e.f)return;st.jp.unshift(e);SV("jp",st.jp);draw()};
const jph=()=>{const L=st.jp.filter(e=>e.w&&e.m&&e.f!==e.b),k=L.length?L.reduce((s,e)=>s+Math.abs(e.m/e.w*1000/(e.f-e.b)),0)/L.length:0;return`<div class="c"><b>Journal d’ajustement du pH</b><div class="r" style="flex-wrap:wrap;margin-top:6px"><input id="jl" placeholder="Lot / formule"><select id="ja"><option>Acide citrique</option><option>Acide lactique</option><option>Soude diluée</option></select><input id="jm" type="number" placeholder="g ajoutés"><input id="jw" type="number" placeholder="Poids du lot (g)" value="${st.qty}"><input id="jb" type="number" step="0.01" placeholder="pH avant"><input id="jf" type="number" step="0.01" placeholder="pH après"><button class="b p" onclick="jpA()">Ajouter</button></div>${k?`<div class="ok">Moyenne observée : ≈ ${k.toFixed(2)} g par kg et par unité de pH. Pour ${st.qty} g et 0,5 unité : ≈ ${(k*st.qty/1000*.5).toFixed(2)} g (ajoutez par paliers et mesurez).</div>`:'<div class="t">Notez vos ajustements : l’appli estimera la dose à prévoir.</div>'}</div>`+st.jp.map((e,i)=>`<div class="r"><span style="flex:1">${e.d} · ${E(e.l)} · ${e.a} ${e.m} g · pH ${e.b} → ${e.f}</span><button class="b" onclick="st.jp.splice(${i},1);SV('jp',st.jp);draw()">✕</button></div>`).join("")};
/* 4. Étiquette */

if(st.p=="co")pr.push("Peut provoquer une réaction allergique. Test 48 h avant usage. Ne pas utiliser sur cils ni sourcils.");

if(R.some(r=>["xber","hmen","heuc"].includes(r.id)))pr.push("Déconseillé aux jeunes enfants ; photosensibilisant (bergamote).");
pr.push(rin?"Éviter le contact avec les yeux ; rincer abondamment.":"Usage externe. Arrêter en cas d’irritation.","Tenir hors de portée des enfants.");
return`<div class="c"><b>Étiquette — ${P[st.p]}</b><div class="r" style="margin-top:6px"><input value="${E(st.fab)}" placeholder="Fabricant et adresse" onchange="st.fab=this.value;SV('fab',st.fab);draw()"><input type="number" value="${st.sp.t||100}" onchange="st.sp.t=+this.value;SV('sp',st.sp);draw()" style="width:90px"><span class="t">g</span></div><div class="c" style="border:2px solid var(--tx)"><b>${P[st.p]}</b> · ${st.sp.t||100} g<div class="t" style="color:var(--tx)"><b>Ingrédients :</b> ${inc}</div>${al.length?`<div class="t" style="color:var(--tx)"><b>Allergènes probables :</b> ${al.join(", ")} (à déclarer au-delà de ${rin?"0,01":"0,001"} %, à confirmer)</div>`:""}<div class="t" style="color:var(--tx)">${pr.join(" ")}</div><div class="t" style="color:var(--tx)">Lot : ${lot} · PAO ${(st.pao[lot]||{}).pao||12} M · ${E(st.fab||"Fabricant à renseigner")}</div></div><button class="b p" onclick="window.print()">🖨 Imprimer</button></div>`};
/* 5. Flacons */
window.flU=(k,v)=>{st.fl[k]=+v;SV("fl",st.fl);draw()};
