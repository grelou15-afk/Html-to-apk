@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e6efec;--mu:#9bb0a9;--ac:#38b8a4;--bd:#2c3a35;--ok:#5fd08a;--ko:#ff8a80}}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:12px;max-width:760px;margin:auto}
h1{font-size:20px;margin:6px 0 10px}nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button,.b{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on,.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;width:100%}
.r{display:flex;gap:6px;align-items:center;margin-bottom:6px}.r input[type=number]{width:80px}
.t{font-size:12px;color:var(--mu)}.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 8px;margin:2px 2px 0 0}
.ok{color:var(--ok)}.ko{color:var(--ko)}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
