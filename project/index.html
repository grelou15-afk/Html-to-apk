<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Associés – Dépenses et gains</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e2e5ec;--ac:#1f6feb;--ok:#168a4a;--ko:#c7392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--tx:#eceff5;--mu:#9aa3b5;--bd:#2c3340;--ac:#5b9dff;--ok:#43c279;--ko:#ff7a70}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--tx:#eceff5;--mu:#9aa3b5;--bd:#2c3340;--ac:#5b9dff;--ok:#43c279;--ko:#ff7a70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.x,button.ed{width:auto;padding:2px 8px;background:transparent;color:var(--ko);font-size:17px}
button.ed{color:var(--ac)}
.ck{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--tx);margin:0 10px 4px 0}.ck input{width:auto}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600}td.n,th.n{text-align:right}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--ko);font-weight:700}
.big{font-size:18px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.set{padding:8px 0;border-bottom:1px solid var(--bd)}
.ch{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;margin-top:12px}.cc{min-width:34px;text-align:center;font-size:10px;color:var(--mu)}
.bs{height:80px;display:flex;align-items:flex-end;gap:2px}.bs i{flex:1;display:block;border-radius:2px 2px 0 0;min-height:1px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;margin:2px 4px 2px 0;font-size:12px}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#lock div{width:100%;max-width:300px}
@media print{.noprint{display:none!important}}

<div class="card noprint">
<h2>Nouvelle écriture</h2>
<div class="grid">
<div><label>Type</label><select id="t"><option value="exp">Dépense</option><option value="rev">Revenu encaissé</option><option value="sal">Salaire / prélèvement</option><option value="tr">Remboursement</option></select></div>
<div id="gc"><label>Société</label><select id="c"></select></div>
<div><label id="lpy">Payé par</label><select id="p"></select></div>
<div id="gq" style="display:none"><label>Reçu par</label><select id="q"></select></div>
<div><label>Montant (DA)</label><input id="m" type="number" min="0" step="any" inputmode="decimal"></div>
<div><label>Date</label><input id="d" type="date"></div>
<div id="gk"><label>Catégorie</label><select id="k"></select></div>
<div id="gf"><label>N° facture / réf.</label><input id="rf"></div>
</div>
<div style="margin-top:10px"><label>Description</label><input id="ds" placeholder="Ex. loyer, matériel…"></div>
<div id="gw" style="margin-top:10px"><label>Dépense concernant seulement (aucune case = tous selon les parts)</label><div id="wl"></div></div>
<div id="gr" style="margin-top:6px"><label class="ck"><input type="checkbox" id="rc"> Répéter chaque mois</label></div>
<div class="row"><button id="add">Ajouter</button><button class="s" id="cn" style="display:none">Annuler</button></div>
</div>

<div class="card noprint"><div class="grid"><div><label>Année</label><select id="fy"></select></div><div><label>Mois</label><select id="fm"><option value="">Tous</option></select></div></div></div>

<div id="dash"></div>
<div class="card"><h2>Historique</h2><div class="wrap" id="hist"></div></div>
<div id="stg"></div>
</main>
<script>
const P=['TMRiadh','TMFarida','OZinou'];
const G='TMRiadh & TMFarida';
const CO={
'My class academy':{u:{[G]:.5,OZinou:.5},m:{TMRiadh:G,TMFarida:G,OZinou:'OZinou'}},
'Fleurida':{u:{TMRiadh:.33,TMFarida:.34,OZinou:.33},m:{TMRiadh:'TMRiadh',TMFarida:'TMFarida',OZinou:'OZinou'}}};
const CATS=['Loyer','Salaires','Matériel','Publicité','Transport','Fournitures','Eau / électricité','Autre'];
const LB={exp:'Dépense',rev:'Revenu',sal:'Salaire',tr:'Remboursement'};
const K='associes-v2',today=new Date().toISOString().slice(0,10);
let S={e:[],r:[],res:{'My class academy':0,'Fleurida':0},pin:''},ed=0,uid=Date.now();
try{const r=JSON.parse(localStorage.getItem(K)||localStorage.getItem('associes-v1')||'null');if(r&&Array.isArray(r.e)){S=Object.assign(S,r);if(!S.r)S.r=[]}}catch(x){}
const $=i=>document.getElementById(i),nid=()=>++uid;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(Math.round(n*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2})+' DA';
const sg=n=>'<span class="'+(n>=0.5?'pos':n<=-0.5?'neg':'')+'">'+(n>0?'+':'')+f(n)+'</span>';
const opt=a=>a.map(v=>'<option>'+v+'</option>').join('');
const hs=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return String(x)};
$('c').innerHTML=opt(Object.keys(CO));$('p').innerHTML=opt(P);$('q').innerHTML=opt(P.concat('Réserve'));$('q').value=P[1];$('k').innerHTML=opt(CATS);
$('wl').innerHTML=P.map(p=>'<label class="ck"><input type="checkbox" class="w" value="'+p+'"> '+p+'</label>').join('');
$('d').value=today;
$('fm').innerHTML+=Array.from({length:12},(_,i)=>'<option value="'+String(i+1).padStart(2,'0')+'">'+String(i+1).padStart(2,'0')+'</option>').join('');

function typeUI(){const t=$('t').value;
$('gc').style.display=t==='tr'?'none':'';$('gq').style.display=t==='tr'?'':'none';
$('gk').style.display=$('gw').style.display=t==='exp'?'':'none';
$('gf').style.display=t==='tr'?'none':'';
$('gr').style.display=(t==='exp'||t==='sal')&&!ed?'':'none';
$('lpy').textContent={exp:'Payé par',rev:'Encaissé par',sal:'Bénéficiaire',tr:'Qui verse'}[t];}
$('t').onchange=typeUI;
function reset(){ed=0;$('add').textContent='Ajouter';$('cn').style.display='none';$('m').value=$('ds').value=$('rf').value='';$('rc').checked=false;document.querySelectorAll('.w').forEach(i=>i.checked=false);typeUI();}
$('cn').onclick=reset;

function genRec(){S.r.forEach(r=>{let[y,mo]=r.from.split('-').map(Number);const end=today.slice(0,7);
for(let i=0;i<600;i++){const ym=y+'-'+String(mo).padStart(2,'0');if(ym>end)break;const d=ym+'-'+String(r.day).padStart(2,'0');
if(d<=today&&!r.gen.includes(ym)){r.gen.push(ym);S.e.push({id:nid(),rid:r.id,t:r.t,c:r.c,p:r.p,q:'',m:r.m,d,k:r.k,ref:r.ref,ds:r.ds,w:r.w})}
mo++;if(mo>12){mo=1;y++}}})}

$('add').onclick=()=>{
const m=parseFloat($('m').value);if(!(m>0))return;
const t=$('t').value;if(t==='tr'&&$('p').value===$('q').value)return;
const w=t==='exp'?[...document.querySelectorAll('.w:checked')].map(i=>i.value):[];
const o={t,c:$('c').value,p:$('p').value,q:$('q').value,m,d:$('d').value,k:$('k').value,ref:$('rf').value,ds:$('ds').value,w};
if(ed){const i=S.e.findIndex(x=>x.id===ed);if(i>=0)S.e[i]=Object.assign(S.e[i],o)}
else{o.id=nid();
if($('rc').checked&&(t==='exp'||t==='sal')){const d=o.d||today;const r={id:nid(),t,c:o.c,p:o.p,m,k:o.k,ref:o.ref,ds:o.ds,w,day:Math.min(28,+d.slice(8,10)||1),from:d.slice(0,7),gen:[d.slice(0,7)]};o.rid=r.id;S.r.push(r)}
S.e.push(o)}
reset();genRec();save();render();};

function calc(L){
const bal={};P.forEach(p=>bal[p]=0);bal['Réserve']=0;const co={};
for(const c in CO){const{u,m:mp}=CO[c];const U=Object.keys(u);
const paid={},rec={},sal={},sp={};U.forEach(k=>{paid[k]=rec[k]=sal[k]=sp[k]=0});
let E=0,R=0,Ec=0,Sl=0;const cat={};
L.filter(x=>x.c===c&&x.t!=='tr').forEach(x=>{const k=mp[x.p];
if(x.t==='rev'){R+=x.m;rec[k]+=x.m}
else if(x.t==='sal'){Sl+=x.m;sal[k]+=x.m}
else{E+=x.m;paid[k]+=x.m;const ct=x.k||'Autre';cat[ct]=(cat[ct]||0)+x.m;
const w=[...new Set((x.w||[]).map(p=>mp[p]))];
if(w.length){const tt=w.reduce((a,z)=>a+u[z],0);w.forEach(z=>sp[z]+=x.m*u[z]/tt)}else Ec+=x.m}});
const pool=R-E-Sl,reserve=(S.res[c]||0)/100*Math.max(0,pool);
const rows=U.map(k=>{const ent=sal[k]+u[k]*(R-Sl-Ec)-sp[k]-u[k]*reserve;const b=ent-(rec[k]-paid[k]);
const ps=P.filter(p=>mp[p]===k);ps.forEach(p=>bal[p]+=b/ps.length);
return{k,s:u[k],paid:paid[k],rec:rec[k],ent,b}});
bal['Réserve']+=reserve;co[c]={E,R,Sl,reserve,pool,rows,cat,Ec}}
L.filter(x=>x.t==='tr').forEach(x=>{bal[x.p]+=x.m;bal[x.q]-=x.m});
return{bal,co}}

function settle(bal){
const ids=P.concat('Réserve');
const cr=ids.filter(p=>bal[p]>0.5).map(p=>[p,bal[p]]).sort((a,b)=>b[1]-a[1]);
const de=ids.filter(p=>bal[p]<-0.5).map(p=>[p,-bal[p]]).sort((a,b)=>b[1]-a[1]);
const out=[];let i=0,j=0;
while(i<de.length&&j<cr.length){const v=Math.min(de[i][1],cr[j][1]);out.push([de[i][0],cr[j][0],v]);de[i][1]-=v;cr[j][1]-=v;if(de[i][1]<0.5)i++;if(cr[j][1]<0.5)j++}
return out}

function chart(L,c){const M={};
L.filter(x=>x.c===c&&(x.t==='exp'||x.t==='rev')&&x.d).forEach(x=>{const k=x.d.slice(0,7);(M[k]=M[k]||{e:0,r:0})[x.t==='exp'?'e':'r']+=x.m});
const ks=Object.keys(M).sort().slice(-12);if(!ks.length)return'';
const mx=Math.max(...ks.map(k=>Math.max(M[k].e,M[k].r)))||1;
return'<div class="ch">'+ks.map(k=>'<div class="cc"><div class="bs"><i style="height:'+M[k].r/mx*100+'%;background:var(--ok)"></i><i style="height:'+M[k].e/mx*100+'%;background:var(--ko)"></i></div><span>'+k.slice(2)+'</span></div>').join('')+'</div><div class="mu">Vert : revenus · Rouge : dépenses</div>'}

function render(){
const ys=[...new Set(S.e.map(x=>(x.d||'').slice(0,4)).filter(Boolean).concat(today.slice(0,4)))].sort().reverse();
const cy=$('fy').value;$('fy').innerHTML='<option value="">Toutes</option>'+opt(ys);$('fy').value=cy;
const fy=$('fy').value,fm=$('fm').value;
const L=S.e.filter(x=>(!fy||(x.d||'').slice(0,4)===fy)&&(!fm||(x.d||'').slice(5,7)===fm));
const{bal,co}=calc(L);let h='';
for(const c in co){const o=co[c];
h+='<div class="card"><h2>'+c+'</h2><div class="grid"><div><div class="mu">Dépenses</div><div class="big">'+f(o.E)+'</div></div><div><div class="mu">Revenus</div><div class="big">'+f(o.R)+'</div></div><div><div class="mu">Salaires</div><div class="big">'+f(o.Sl)+'</div></div><div><div class="mu">Réserve</div><div class="big">'+f(o.reserve)+'</div></div><div><div class="mu">Résultat</div><div class="big">'+sg(o.pool)+'</div></div></div>';
h+='<div class="wrap"><table><tr><th>Associé</th><th class="n">Part</th><th class="n">Dépensé</th><th class="n">Encaissé</th><th class="n">Droit</th><th class="n">Solde</th></tr>';
o.rows.forEach(r=>h+='<tr><td>'+r.k+(r.k===G?' <span class="mu">(un seul associé)</span>':'')+'</td><td class="n">'+Math.round(r.s*100)+' %</td><td class="n">'+f(r.paid)+'</td><td class="n">'+f(r.rec)+'</td><td class="n">'+f(r.ent)+'</td><td class="n">'+sg(r.b)+'</td></tr>');
h+='</table></div>';
const cs=Object.keys(o.cat);if(cs.length)h+='<div style="margin-top:8px">'+cs.map(k=>'<span class="chip">'+k+' : '+f(o.cat[k])+'</span>').join('')+'</div>';
h+=chart(L,c)+'</div>'}
const st=settle(bal);
h+='<div class="card"><h2>Bilan global et règlements</h2><div class="grid">'+P.concat(bal['Réserve']>0.5?'Réserve':[]).map(p=>'<div><div class="mu">'+(p==='Réserve'?'Réserve commune':p)+'</div><div class="big">'+sg(bal[p])+'</div></div>').join('')+'</div>';
h+='<p class="mu">Positif : doit recevoir · Négatif : doit verser (deux sociétés cumulées). Pour My class academy, le solde de TMRiadh & TMFarida est réparti à parts égales entre eux.</p>';
h+=st.length?st.map(s=>'<div class="set"><b>'+s[0]+'</b> doit verser <b>'+f(s[2])+'</b> à <b>'+(s[1]==='Réserve'?'la réserve commune':s[1])+'</b></div>').join(''):'<div class="mu">Tout est équilibré.</div>';
h+='</div>';$('dash').innerHTML=h;
const rows=[...L].sort((a,b)=>(b.d||'').localeCompare(a.d||'')||b.id-a.id);
$('hist').innerHTML=rows.length?'<table><tr><th>Date</th><th>Type</th><th>Société</th><th>Associé</th><th class="n">Montant</th><th>Détail</th><th class="noprint"></th></tr>'+rows.map(x=>'<tr><td>'+(x.d||'')+'</td><td>'+LB[x.t]+(x.rid?' ↻':'')+'</td><td>'+(x.t==='tr'?'—':x.c)+'</td><td>'+x.p+(x.t==='tr'?' → '+x.q:'')+'</td><td class="n">'+f(x.m)+'</td><td>'+esc([x.t==='exp'?x.k:'',x.ref?'réf. '+x.ref:'',x.ds,(x.w&&x.w.length)?'(pour '+x.w.join(', ')+')':''].filter(Boolean).join(' · '))+'</td><td class="noprint"><button class="ed" data-id="'+x.id+'" aria-label="Modifier">✎</button><button class="x" data-id="'+x.id+'" aria-label="Supprimer">×</button></td></tr>').join('')+'</table>':'<div class="mu">Aucune écriture pour cette période.</div>';
$('hist').querySelectorAll('.x').forEach(b=>b.onclick=()=>{S.e=S.e.filter(x=>x.id!=b.dataset.id);save();render()});
$('hist').querySelectorAll('.ed').forEach(b=>b.onclick=()=>edit(+b.dataset.id));
let g='<div class="card noprint"><h2>Réglages</h2><div class="grid">'+Object.keys(CO).map((c,i)=>'<div><label>Réserve commune sur bénéfice – '+c+' (%)</label><input type="number" min="0" max="100" data-c="'+c+'" class="rs" value="'+(S.res[c]||0)+'"></div>').join('')+'</div>';
g+='<h2 style="margin-top:14px">Dépenses et salaires récurrents</h2>'+(S.r.length?S.r.map(r=>'<div class="set">'+LB[r.t]+' · '+r.c+' · '+r.p+' · '+f(r.m)+' le '+r.day+' <button class="x" data-r="'+r.id+'" aria-label="Arrêter">×</button></div>').join(''):'<div class="mu">Aucun.</div>');
g+='<h2 style="margin-top:14px">Code d’accès</h2><div class="row"><input id="np" type="password" inputmode="numeric" placeholder="Nouveau code"><button class="s" id="sp">Définir</button><button class="s" id="rp">Retirer</button></div><p class="mu">Protège l’accès à cet appareil (code non chiffré côté navigateur).</p>';
g+='<h2 style="margin-top:14px">Export et sauvegarde</h2><textarea id="bk" rows="4"></textarea><div class="row"><button class="s" id="ex">Export CSV</button><button class="s" id="pr">Imprimer / PDF</button></div><div class="row"><button class="s" id="ej">Sauvegarde JSON</button><button class="s" id="im">Importer JSON</button></div></div>';
$('stg').innerHTML=g;
$('stg').querySelectorAll('.rs').forEach(i=>i.onchange=()=>{S.res[i.dataset.c]=Math.min(100,Math.max(0,parseFloat(i.value)||0));save();render()});
$('stg').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.r=S.r.filter(r=>r.id!=b.dataset.r);save();render()});
$('sp').onclick=()=>{if($('np').value){S.pin=hs($('np').value);save();$('np').value=''}};
$('rp').onclick=()=>{S.pin='';save()};
$('ex').onclick=()=>{$('bk').value=['Date;Type;Société;Associé;Vers;Montant;Catégorie;Réf;Description'].concat(rows.map(x=>[x.d,LB[x.t],x.t==='tr'?'':x.c,x.p,x.q&&x.t==='tr'?x.q:'',x.m,x.k||'',x.ref||'',(x.ds||'').replace(/;/g,',')].join(';'))).join('\n');$('bk').select()};
$('pr').onclick=()=>{try{window.print()}catch(e){}};
$('ej').onclick=()=>{$('bk').value=JSON.stringify(S);$('bk').select()};
$('im').onclick=()=>{try{const d=JSON.parse($('bk').value);if(d&&Array.isArray(d.e)){S=Object.assign({e:[],r:[],res:S.res,pin:S.pin},d);save();render()}}catch(x){}};
}
function edit(id){const x=S.e.find(y=>y.id===id);if(!x)return;ed=id;$('t').value=x.t;typeUI();
$('c').value=x.c||Object.keys(CO)[0];$('p').value=x.p;$('q').value=x.q||P[1];$('m').value=x.m;$('d').value=x.d||'';$('k').value=x.k||'Autre';$('rf').value=x.ref||'';$('ds').value=x.ds||'';
document.querySelectorAll('.w').forEach(i=>i.checked=(x.w||[]).includes(i.value));
$('add').textContent='Enregistrer';$('cn').style.display='';window.scrollTo(0,0)}
$('fy').onchange=$('fm').onchange=render;
$('lb').onclick=()=>{if(hs($('lp').value)===S.pin){$('lock').style.display='none';$('mn').style.display=''}else $('le').textContent='Code incorrect.'};
if(S.pin){$('lock').style.display='flex';$('mn').style.display='none'}
genRec();save();typeUI();render();
</script>
</body>
</html>
