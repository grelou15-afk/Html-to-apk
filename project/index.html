<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Marketing — Cosmétiques & École</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e5e1db;--pr:#0f766e;--prt:#fff;--cos:#be185d;--lang:#1d4ed8;--ok:#15803d;--ko:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mu:#9aa3af;--bd:#2d3239;--pr:#2dd4bf;--prt:#0b1f1d;--cos:#f472b6;--lang:#60a5fa;--ok:#4ade80;--ko:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mu:#9aa3af;--bd:#2d3239;--pr:#2dd4bf;--prt:#0b1f1d;--cos:#f472b6;--lang:#60a5fa;--ok:#4ade80;--ko:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 14px 6px;max-width:900px;margin:auto}
h1{font-size:20px;margin:0 0 8px}
.chips,.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip,.nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:99px;font:inherit;white-space:nowrap;cursor:pointer}
.chip.on,.nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
main{max-width:900px;margin:auto;padding:8px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;flex:1 1 120px}
button.b{background:var(--pr);color:var(--prt);border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.cos{color:var(--cos)}.lang{color:var(--lang)}
.item{border-top:1px solid var(--bd);padding:9px 0;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.item:first-of-type{border-top:0}
.mu{color:var(--mu);font-size:13px}
.adv{border-left:4px solid var(--pr);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0}
.adv.w{border-color:var(--ko)}.adv.o{border-color:var(--ok)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.tbl{overflow-x:auto}
a.lk{color:var(--pr);font-weight:600;text-decoration:none}
.med{font-size:20px;min-width:30px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;z-index:20;display:none}
@media print{.nav,.chips,button,#toast{display:none!important}}

all:["Publiez 3 à 5 fois par semaine et gardez des horaires réguliers (souvent 12 h–14 h et 19 h–21 h).","Règle 80/20 : 80 % de contenu utile ou divertissant, 20 % de vente directe.","Les 3 premières secondes d’une vidéo décident de tout : commencez par la question ou le résultat.","Terminez chaque publication par un appel à l’action unique : écrire, commander, s’inscrire.","Répondez à tous les commentaires dans les 2 heures : l’algorithme récompense l’interaction.","Réutilisez : une vidéo = 1 reel + 3 stories + 1 photo + 1 citation.","Sur Facebook/Instagram, testez 2 visuels pour une même pub avec un petit budget avant d’investir.","Mesurez chaque mois : abonnés, messages reçus, ventes ou inscriptions, coût par client."]};

function vDates(){var t=today(),a=DK.map(function(x,i){return[x,i]}).filter(function(p){return p[0][0]>=t&&(S.f==='all'||p[0][2].indexOf(S.f)>-1)});return '<div class="card"><h2>Dates clés à exploiter</h2><p class="mu">Le bouton planifie la publication 1 semaine avant. Les dates religieuses sont approximatives.</p>'+(a.map(function(p){var x=p[0];return '<div class="item"><div><b>'+x[1]+'</b><br><span class="mu">'+x[0]+'</span><br>'+x[3]+'</div><div class="row">'+x[2].filter(function(d){return S.f==='all'||S.f===d}).map(function(d){return '<button class="g" onclick="addDK('+p[1]+',\''+d+'\')">📅 '+(d==='cos'?'Cosmétiques':'École')+'</button>'}).join('')+'</div></div>'}).join('')||'<p class="mu">Aucune date à venir.</p>')+'</div>'}
function vObj(){var a=vis(S.obj);return '<div class="card"><h2>Nouvel objectif du mois</h2><div class="row"><input id="on" placeholder="Ex. +300 abonnés / 30 inscriptions">'+domSel('od')+'<input id="oc" type="number" placeholder="Cible"><button class="b" onclick="addObj()">Ajouter</button></div></div><div class="card"><h2>Progression</h2>'+(a.map(function(x){var p=x.cible?Math.min(100,x.actuel/x.cible*100):0;return '<div class="item" style="display:block"><div class="row" style="justify-content:space-between"><b>'+esc(x.nom)+'</b>'+dtag(x.dom)+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="row" style="margin-top:6px"><span class="mu">Actuel</span><input type="number" value="'+x.actuel+'" onchange="setO(\''+x.id+'\',this.value)"><span class="mu">/ '+fmt(x.cible)+' ('+Math.round(p)+' %)</span><button class="g" onclick="del(\'obj\',\''+x.id+'\')">✕</button></div></div>'}).join('')||'<p class="mu">Aucun objectif.</p>')+'</div>'}
function addObj(){var n=$('on').value.trim();if(!n)return;S.obj.push({id:uid(),nom:n,dom:$('od').value,cible:+$('oc').value||0,actuel:0});save();render()}
function setO(id,v){S.obj.forEach(function(x){if(x.id===id)x.actuel=+v||0});save();render()}
function vPromo(){var a=vis(S.promo),ca=0,by={};a.forEach(function(x){ca+=+x.ventes||0;by[x.canal]=(by[x.canal]||0)+(+x.ventes||0)});var b=Object.keys(by).sort(function(m,n){return by[n]-by[m]})[0];return '<div class="card"><h2>Nouveau code promo</h2><div class="row"><input id="pc" placeholder="Code (ex. INSTA10)">'+domSel('pdm')+'<select id="pcn">'+opts(PL.concat(['Autre']))+'</select><input id="pr" placeholder="Remise (ex. 10 %)"><button class="b" onclick="addPromo()">Ajouter</button></div></div><div class="card"><h2>Résultats par code</h2>'+(a.map(function(x){return '<div class="item" style="display:block"><div class="row" style="justify-content:space-between"><b>'+esc(x.code)+'</b>'+dtag(x.dom)+'</div><div class="mu">'+esc(x.canal)+' · remise '+esc(x.remise)+'</div><div class="row" style="margin-top:6px"><span class="mu">Utilisations</span><input type="number" value="'+x.util+'" onchange="setP(\''+x.id+'\',\'util\',this.value)"><span class="mu">Ventes (DA)</span><input type="number" value="'+x.ventes+'" onchange="setP(\''+x.id+'\',\'ventes\',this.value)"><button class="g" onclick="del(\'promo\',\''+x.id+'\')">✕</button></div></div>'}).join('')||'<p class="mu">Aucun code.</p>')+(b&&by[b]>0?'<div class="adv o">Meilleur canal : '+esc(b)+' ('+fmt(by[b])+' DA)</div>':'')+'<p class="mu">Total ventes : '+fmt(ca)+' DA</p></div>'}
function addPromo(){var c=$('pc').value.trim();if(!c)return;S.promo.push({id:uid(),code:c,dom:$('pdm').value,canal:$('pcn').value,remise:$('pr').value,util:0,ventes:0});save();render()}
function setP(id,k,v){S.promo.forEach(function(x){if(x.id===id)x[k]=+v||0});save();render()}
function setB(k,v){S.bud[k]=+v||0;save();render()}
function vBud(){var b=S.bud,c=b.t*b.p/100,l=b.t-c,sp={cos:0,lang:0};S.camps.forEach(function(x){sp[x.dom]+=+x.depense||0});function bl(n,al,s,d){var p=al?Math.min(100,s/al*100):0;return '<div class="item" style="display:block"><div class="row" style="justify-content:space-between"><b class="'+d+'">'+n+'</b><span>'+fmt(al)+' DA</span></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="mu">Dépensé '+fmt(s)+' DA · Reste '+fmt(al-s)+' DA</div></div>'}return '<div class="card"><h2>Budget marketing mensuel</h2><div class="row"><span class="mu">Total (DA)</span><input type="number" value="'+b.t+'" onchange="setB(\'t\',this.value)"></div><div class="row" style="margin-top:8px"><span class="mu">Cosmétiques '+b.p+' %</span><input type="range" min="0" max="100" step="5" value="'+b.p+'" onchange="setB(\'p\',this.value)"><span class="mu">École '+(100-b.p)+' %</span></div></div><div class="card"><h2>Répartition</h2>'+bl('Cosmétiques',c,sp.cos,'cos')+bl('École de langues',l,sp.lang,'lang')+'<p class="mu">Le dépensé vient de l’onglet Pubs et sponsors.</p></div>'}
var CK=['Visuel net et lumineux','Légende avec un appel à l’action','5 à 10 hashtags','Prix ou contact bien visible','Orthographe relue','Autorisation si une personne ou un enfant apparaît','Horaire de publication choisi','Je réponds aux commentaires dans les 2 h'],RP={cos:['Bonjour ! Merci pour votre intérêt 😊 Quel produit vous intéresse ? Je vous envoie les prix, les formats et les conditions de livraison.','Nos produits sont fabriqués localement et contrôlés à chaque étape. Souhaitez-vous essayer un échantillon ?','Merci pour votre retour, nous sommes ravis que le produit vous plaise 💚 Une photo et un avis nous aideraient beaucoup !'],lang:['Bonjour ! Pour quel âge et quelle langue cherchez-vous un cours ? Je vous envoie le programme, les horaires et les tarifs.','Nous proposons une séance d’essai gratuite. Quel jour vous conviendrait ?','Les inscriptions sont ouvertes, avec un nombre de places limité par groupe. Souhaitez-vous réserver une place ?','Nous sommes désolés pour ce désagrément. Pouvez-vous nous écrire en privé pour que nous trouvions une solution rapidement ?']};
function vMod(){var n=CK.filter(function(x,i){return S.chk[i]}).length;return '<div class="card"><h2>Checklist avant publication ('+n+'/'+CK.length+')</h2>'+CK.map(function(x,i){return '<label class="item" style="cursor:pointer"><span>'+x+'</span><input type="checkbox" style="flex:0 0 auto" '+(S.chk[i]?'checked':'')+' onchange="S.chk['+i+']=this.checked;save();render()"></label>'}).join('')+'<button class="g" onclick="S.chk={};save();render()">Réinitialiser</button></div>'+['cos','lang'].filter(function(d){return S.f==='all'||S.f===d}).map(function(d){return '<div class="card"><h2 class="'+d+'">Réponses prêtes — '+DN[d]+'</h2>'+RP[d].map(function(t,i){var id='rp'+d+i;return '<textarea id="'+id+'" rows="3" style="width:100%;margin-top:6px" readonly>'+esc(t)+'</textarea><button class="g" onclick="cp(\''+id+'\')">Copier</button>'}).join('')+'</div>'}).join('')}
var WT={lang:[['Rappel d’inscriptions','Bonjour {p} 👋 Les inscriptions pour {c} sont ouvertes jusqu’au {d}. Les places sont limitées par groupe. Souhaitez-vous réserver une place pour votre enfant ?'],['Relance après séance d’essai','Bonjour {p}, merci d’être venu(e) à la séance d’essai de {c} 😊 Qu’en avez-vous pensé ? Je peux vous réserver une place dès cette semaine.'],['Annonce de la session d’été','Bonjour {p} ☀️ Notre session d’été {c} démarre bientôt : oral, prononciation, jeux et activités. Répondez « OUI » pour recevoir le programme et les tarifs.'],['Parrainage','Bonjour {p}, merci pour votre confiance 💙 Pour chaque ami inscrit à {c}, vous bénéficiez d’une réduction. N’hésitez pas à partager ce message !'],['Reprise des cours','Bonjour {p}, les cours de {c} reprennent le {d}. Merci de nous confirmer la présence de votre enfant.']],cos:[['Relance réassort','Bonjour {p} 👋 Votre {c} doit bientôt être terminé ? Nous avons du stock disponible. Souhaitez-vous recommander ? Livraison possible.'],['Nouveau produit','Bonjour {p} ✨ Nouveau chez nous : {c}. Voulez-vous l’essayer ? Écrivez-moi pour les prix et la livraison.'],['Offre spéciale','Bonjour {p}, offre spéciale jusqu’au {d} sur {c} 🎁 Répondez à ce message pour commander.']]};
function wf(t){var w=S.wa||{};return t.replace(/\{p\}/g,w.p||'…').replace(/\{c\}/g,w.c||'…').replace(/\{d\}/g,w.d||'…')}
function waU(){S.wa={p:$('wp').value,c:$('wc').value,d:$('wd').value};var a=document.querySelectorAll('textarea[data-t]');for(var i=0;i<a.length;i++)a[i].value=wf(a[i].getAttribute('data-t'))}
function waGo(id){cp(id);try{window.open('https://wa.me/?text='+encodeURIComponent($(id).value),'_blank')}catch(e){}}
function vWa(){S.wa=S.wa||{p:'',c:'',d:''};var h='<div class="card"><h2>Messages WhatsApp</h2><div class="row"><input id="wp" placeholder="Prénom du parent ou client" value="'+esc(S.wa.p)+'" oninput="waU()"><input id="wc" placeholder="Cours ou produit" value="'+esc(S.wa.c)+'" oninput="waU()"><input id="wd" placeholder="Date limite ou de reprise" value="'+esc(S.wa.d)+'" oninput="waU()"></div><p class="mu">Remplissez les champs : les messages se mettent à jour. « Envoyer » copie le texte et ouvre WhatsApp.</p></div>';['lang','cos'].filter(function(d){return S.f==='all'||S.f===d}).forEach(function(d){h+='<div class="card"><h2 class="'+d+'">'+DN[d]+'</h2>'+WT[d].map(function(x,i){var id='wa'+d+i;return '<b>'+x[0]+'</b><textarea id="'+id+'" data-t="'+esc(x[1])+'" rows="3" style="width:100%;margin:4px 0">'+esc(wf(x[1]))+'</textarea><div class="row"><button class="g" onclick="cp(\''+id+'\')">Copier</button><button class="g" onclick="waGo(\''+id+'\')">Envoyer ↗</button></div>'}).join('')+'</div>'});return h}
function vRep(){var m=today().slice(0,7),mn=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),s=stats(),P=vis(S.posts).filter(function(x){return (x.date||'').slice(0,7)===m}),pub=P.filter(function(x){return x.statut==='Publié'}).length,ca=0;vis(S.promo).forEach(function(x){ca+=+x.ventes||0});var I=vis(S.infl),ok=I.filter(function(x){return x.st==='Accord'||x.st==='Terminé'}).length,L=['RAPPORT MARKETING — '+mn+' ('+(S.f==='all'?'Cosmétiques + École de langues':DN[S.f])+')','','Publications : '+pub+' publiées sur '+P.length+' prévues ce mois','Pubs et sponsors : budget '+fmt(s.b)+' DA, dépensé '+fmt(s.d)+' DA, '+s.l+' clients/inscrits, coût par client '+(s.l?fmt(s.cpl)+' DA':'—'),'Abonnés : '+fmt(s.tot)+' (croissance '+(s.gr>=0?'+':'')+fmt(s.gr)+')','Codes promo : '+fmt(ca)+' DA de ventes','Influenceurs : '+I.length+' suivis, '+ok+' avec accord ou terminés'];var O=vis(S.obj);if(O.length){L.push('','Objectifs :');O.forEach(function(x){L.push('- '+x.nom+' : '+x.actuel+' / '+x.cible+' ('+(x.cible?Math.round(x.actuel/x.cible*100):0)+' %)')})}L.push('','Conseils :');advice().slice(0,3).forEach(function(a){L.push('- '+a[1])});var t=L.join('\n');return '<div class="card"><h2>Rapport mensuel</h2><textarea id="rpt" rows="18" style="width:100%" readonly>'+esc(t)+'</textarea><div class="row" style="margin-top:6px"><button class="g" onclick="cp(\'rpt\')">Copier</button><button class="g" onclick="try{window.print()}catch(e){msg(\'Impression indisponible : copiez le texte\')}">Imprimer / PDF</button></div><p class="mu">Le rapport se calcule à partir de vos données. Changez le filtre en haut pour un rapport par domaine.</p></div>'}
